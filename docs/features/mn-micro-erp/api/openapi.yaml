        balAccountType: {type: [string, 'null'], enum: [GL_ACCOUNT, BANK_ACCOUNT, null]}
        balAccountId: {type: [string, 'null'], format: uuid}
        reasonCodeId: {type: [string, 'null'], format: uuid}
      description: '`Journal`-ийн JSON Merge Patch (RFC 7396). Илгээсэн талбар л өөрчлөгдөнө; `null` нь сонголттой талбарыг
        цэвэрлэнэ.'
