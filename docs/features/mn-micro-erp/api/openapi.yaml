# yaml-language-server: $schema=https://spec.openapis.org/oas/3.1/schema/2022-10-07
# MN Micro ERP public API (OpenAPI 3.1). Rules: ../14-api.md. Names: db/schema/*.sql (DECISIONS D-K1).
openapi: '3.1.0'
info:
  title: MN Micro ERP — Public API
  version: 1.0.0-draft
  summary: Монголын бичил бизнесийн нягтлан бодох бүртгэл, eBarimt-тэй ERP (BC логикийн хялбарчилсан хувилбар).
  description: |
    Монголын бичил бизнесийн ERP-ийн **нийтийн REST API** (v1). Дүрмийн бүрэн тайлбар:
    [14-api.md](../14-api.md). Энэ файл нь дизайны гэрээ (contract); код дахь `/openapi/v1.json` үүнтэй `oasdiff`-ээр тулгагдана.

    **Товч дүрэм**
    - Суурь зам `/api/v1`; компанийн өгөгдөл `/companies/{companyId}/…`. Тенант нь session/токеноос.
    - JSON `camelCase`; enum `UPPER_SNAKE` (DB-тэй ижил). Клиент танихгүй талбар ба enum утгыг **тэвчинэ**.
    - **Мөнгө, тоо хэмжээ, ханш, хувь — string** (`"1100.00"`). JSON number → 400 `api.money_must_be_string`.
    - Огноо `YYYY-MM-DD` (бизнесийн огноо, Asia/Ulaanbaatar); цаг ISO 8601 UTC (`Z`).
    - Жагсаалт: keyset (`limit` ≤ 200, `after` = `nextCursor`), `sort=-postingDate,number`.
    - Алдаа: RFC 9457 `application/problem+json`, тогтвортой `code`, `errors[]`, `traceId`.
    - Бүх үйлдлийн POST-д `Idempotency-Key` (preview, тайлан ажиллуулахаас бусад).
    - Мутабл resource-д `ETag`/`If-Match` (`"<row_version>"`); байхгүй 428, зөрвөл 412.
    - Үйлдэл: `POST …/{id}:post`, `:preview`, `:cancel` (D-I1).
    - Async: 202 + `Location: …/jobs/{jobId}`.
    - Эрх: operation бүрийн `x-permission` (BC RIMDX загвар, 13-security §6).
    - Хувилбар: v1 дотор зөвхөн нэмэлт; `Deprecation`/`Sunset` header.
    - Бүх хариу `Cache-Control: no-store`; header `X-Request-Id`, `traceparent`, `RateLimit-*`.
  license: {name: Proprietary, identifier: LicenseRef-Proprietary}
  contact: {name: MN Micro ERP API team}
servers:
- url: /api/v1
  description: Тухайн deployment-ийн origin (SPA ба API нэг origin, 13 SEC-AUTH-03).
security:
- {bffSession: []}
- {oauth2: [erp.api]}
tags:
- name: Companies
  description: Хэрэглэгчийн хандах компаниуд ба компанийн профайл (FR-PLT-002, FR-PLT-019).
- name: Lookups
  description: Лавлах жагсаалт (зөвхөн унших). Тохиргооны CRUD нь модулийн spec-д.
- name: GL Accounts
  description: Дансны төлөвлөгөө (BC T15, FR-GL-001..005).
- name: Journals
  description: Ерөнхий журнал (BC T80/232/81), батлах ба preview (FR-GL-006..011, FR-GL-016).
- name: GL Entries
  description: 'Ерөнхий дэвтэр: ваучер, register, G/L entry (зөвхөн унших) ба буцаалт (FR-GL-012..015).'
- name: Customers
  description: Харилцагч (BC T18, FR-PTY-001).
- name: Vendors
  description: Нийлүүлэгч (BC T23, FR-PTY-002).
- name: Items
  description: Бараа/үйлчилгээ (BC T27, FR-INV-001).
- name: Sales Invoices
  description: 'Борлуулалтын нэхэмжлэх: ноорог → post → цуцлах (FR-SAL-001..015).'
- name: Sales Credit Memos
  description: Борлуулалтын кредит нот / буцаалт (FR-SAL-007).
- name: Purchase Invoices
  description: Худалдан авалтын нэхэмжлэх (FR-PUR-001..007).
- name: Purchase Credit Memos
  description: Худалдан авалтын кредит нот (FR-PUR-005).
- name: Payments
  description: Төлбөр, орлого, данс хоорондын шилжүүлэг, кассын баримт МХ-1/МХ-2 (FR-BNK-002..007).
- name: Customer Ledger
  description: 'Авлагын дэд дэвтэр (party schema, D-K2): унших, тулгах, тулгалт буцаах (FR-PTY-007..014).'
- name: Vendor Ledger
  description: 'Өглөгийн дэд дэвтэр (party schema, D-K2): унших, тулгах, тулгалт буцаах (FR-PTY-007..014).'
- name: Bank Accounts
  description: Банк, касс, хэтэвч ба bank ledger (FR-BNK-001, FR-BNK-004).
- name: Bank Statements
  description: Хуулга импорт ба тулгалт (FR-BNK-008..016).
- name: Currencies
  description: Валют ба ханш (BC T4/T330; функц R2, D-G3).
- name: Periods
  description: 'Санхүүгийн жил, нягтлан бодох үе: хаах, дахин нээх, түгжих, жилийн хаалт (D-D3, D-D4, FR-GL-022..026).'
- name: VAT
  description: НӨАТ-ын үе ба тайлан (D-E8, D-E9, FR-TAX-013..015). Хаалт (settlement)-ын API нь 08 spec-д.
- name: Reports
  description: 'Тайлан: гүйлгээ баланс, насжилт, санхүүгийн тайлан, НӨАТ; экспорт (FR-RPT-*).'
- name: eBarimt
  description: 'eBarimt баримт: унших, гараар шийдэх, дахин илгээх (12-ebarimt §18, D-J2).'
- name: Tax Parameters
  description: Хуулийн огноотой параметр (глобал, зөвхөн унших, D-E7).
- name: Jobs
  description: Async job-ийн төлөв, цуцлалт (§10).
- name: Webhooks
  description: Webhook захиалга ба илгээлт (R2, §11).
x-tagGroups:
- name: Платформ
  tags: [Companies, Lookups, Jobs, Tax Parameters, Webhooks]
- name: Ерөнхий дэвтэр
  tags: [GL Accounts, Journals, GL Entries, Periods, Currencies]
- name: Харилцагч ба баримт
  tags:
  - Customers
  - Vendors
  - Items
  - Sales Invoices
  - Sales Credit Memos
  - Purchase Invoices
  - Purchase Credit Memos
  - Customer Ledger
  - Vendor Ledger
- {name: Мөнгө, tags: [Payments, Bank Accounts, Bank Statements]}
- {name: Татвар ба тайлан, tags: [VAT, Reports, eBarimt]}
paths:
  /companies:
    get:
      operationId: listCompanies
      summary: Хандах компаниудын жагсаалт
      tags: [Companies]
      description: '**Эрх:** `AUTHENTICATED (user_company_role-той компани л)`. **Хувилбар:** R1. **Шаардлага:** FR-PLT-004.'
      x-permission: AUTHENTICATED (user_company_role-той компани л)
      x-release: R1
      x-requirements: [FR-PLT-004]
      parameters:
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/After'}
      - {$ref: '#/components/parameters/Sort'}
      responses:
        '200':
          description: Компаниуд
          content:
            application/json: {schema: {$ref: '#/components/schemas/CompanySummaryList'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/ServerError'}
  /companies/{companyId}:
    parameters:
    - {$ref: '#/components/parameters/CompanyId'}
    get:
      operationId: getCompany
      summary: Компанийн профайл
      tags: [Companies]
      description: '**Эрх:** `TABLE platform.company_setup R`. **Хувилбар:** R1. **Шаардлага:** FR-PLT-002.'
      x-permission: TABLE platform.company_setup R
      x-release: R1
      x-requirements: [FR-PLT-002]
      responses:
        '200':
          description: Компани
          content:
            application/json: {schema: {$ref: '#/components/schemas/Company'}}
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/ServerError'}
    patch:
      operationId: updateCompany
      summary: Компанийн профайл засах
      tags: [Companies]
      description: |-
        `vatRegistered`-ийг `true` болгоход `tin` заавал (DB CHECK). НӨАТ төлөгч болох/болиулах өөрчлөлт нь 08 spec-ийн процессоор.

        **Эрх:** `TABLE platform.company_setup M`. **Хувилбар:** R1. **Шаардлага:** FR-PLT-002, FR-PLT-019.
      x-permission: TABLE platform.company_setup M
      x-release: R1
      x-requirements: [FR-PLT-002, FR-PLT-019]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json: {schema: {$ref: '#/components/schemas/CompanyUpdate'}}
          application/json: {schema: {$ref: '#/components/schemas/CompanyUpdate'}}
      responses:
        '200':
          description: Шинэчилсэн
          content:
            application/json: {schema: {$ref: '#/components/schemas/Company'}}
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/ServerError'}
  /companies/{companyId}/settings/posting-window:
    parameters:
    - {$ref: '#/components/parameters/CompanyId'}
    patch:
      operationId: updatePostingWindow
      summary: Компанийн posting цонх
      tags: [Companies]
      description: |-
        D-D3: цонхноос гадуур posting бүх эрхэд хориотой. `If-Match` = компанийн ETag.

        **Эрх:** `TABLE platform.company_setup M (MFA; 13 SEC-POST-07)`. **Хувилбар:** R1. **Шаардлага:** FR-GL-023.
      x-permission: TABLE platform.company_setup M (MFA; 13 SEC-POST-07)
      x-release: R1
      x-requirements: [FR-GL-023]
      parameters:
      - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/merge-patch+json: {schema: {$ref: '#/components/schemas/PostingWindowUpdate'}}
          application/json: {schema: {$ref: '#/components/schemas/PostingWindowUpdate'}}
      responses:
        '200':
          description: Шинэчилсэн
          content:
            application/json: {schema: {$ref: '#/components/schemas/Company'}}
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/ServerError'}
