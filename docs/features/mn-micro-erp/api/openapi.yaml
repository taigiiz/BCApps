components:
  securitySchemes:
    bffSession:
      type: apiKey
      in: cookie
      name: __Host-erp
      description: 'SPA-ийн BFF session (ADR-0016). Төлөв өөрчлөх хүсэлт бүрд `X-CSRF: 1` header заавал (13 SEC-AUTH-02).
        Cookie ба Bearer зэрэг → 400 `platform.ambiguous_credentials`.'
    oauth2:
      type: oauth2
      description: Интеграцийн client (`client_credentials`, 13 §5.9). Токен 10 мин; claim `erp_tid`, `erp_cid`. Эрх нь client-д
        оноосон permission set-ээр.
      flows:
        clientCredentials:
          tokenUrl: /connect/token
          scopes: {erp.api: ERP API (эрх нь client-ийн permission set-ээр хязгаарлагдана)}
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      description: Компанийн id. Хандах эрхгүй бол 404 `platform.company_not_found` (§14.2, API-AUTH-06).
      schema: {type: string, format: uuid}
    Id:
      name: id
      in: path
      required: true
      description: Resource-ийн id (UUIDv7). Баримтын хувьд ноорогоос posted хүртэл тогтвортой (§2.4).
      schema: {type: string, format: uuid}
    LineId:
      name: lineId
      in: path
      required: true
      description: Мөрийн id.
      schema: {type: string, format: uuid}
    JobId:
      name: jobId
      in: path
      required: true
      description: Job-ийн id (`integration.job_run.id`).
      schema: {type: string, format: uuid}
    RateId:
      name: rateId
      in: path
      required: true
      description: Ханшийн мөрийн id.
      schema: {type: string, format: uuid}
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      description: Webhook илгээлтийн id.
      schema: {type: string, format: uuid}
    ParamCode:
      name: paramCode
      in: path
      required: true
      description: Хуулийн параметрийн код (`tax.tax_parameter.param_code`).
      schema:
        type: string
        pattern: ^[a-z0-9_]+(\.[a-z0-9_]+)+$
        examples: [vat.standard_rate]
    ReportCode:
      name: reportCode
      in: path
      required: true
      description: Экспортлох тайлан.
      schema:
        type: string
        enum:
        - trial-balance
        - customer-aging
        - vendor-aging
        - vat-return
        - financial-report
        - general-ledger
        - customer-statement
        - vendor-statement
        - cash-bank-book
        - sales-journal
        - purchase-journal
        - ebalance-keying-sheet
        - gl-entries
        - customer-ledger-entries
        - vendor-ledger-entries
        - bank-ledger-entries
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Давхар үйлдлээс хамгаалах түлхүүр (§7). 8–200 тэмдэгт; UUID санал болгоно. Ижил түлхүүр + ижил хүсэлт
        → хадгалсан хариу (`Idempotent-Replayed: true`); өөр хүсэлт → 422 `api.idempotency_key_reused`.'
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9_\-:.]{8,200}$
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: PATCH/DELETE-д сонголттой (§7, API-IDEM-01). Илгээвэл POST-той ижил дүрмээр хэрэгжинэ.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: ^[A-Za-z0-9_\-:.]{8,200}$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Сүүлд уншсан `ETag` (§6). Байхгүй → 428; зөрвөл → 412; `*` хориотой.
      schema: {type: string, pattern: '^"[0-9A-Za-z_-]{1,64}"$', examples: ['"3"']}
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: Сонголттой `ETag` шалгалт (§6). Илгээсэн бол зөрвөл 412.
      schema: {type: string, pattern: '^"[0-9A-Za-z_-]{1,64}"$'}
    Limit:
      name: limit
      in: query
      required: false
      description: Хуудасны хэмжээ. Анхдагч 50; 200-аас их бол 200 болгож бууруулна (FR-INT-001 AC3).
      schema: {type: integer, minimum: 1, default: 50}
    After:
      name: after
      in: query
      required: false
      description: Өмнөх хуудасны `nextCursor` (opaque). Шүүлт/эрэмбэ өөрчлөгдвөл 400 `api.cursor_mismatch`.
      schema: {type: string, maxLength: 1024}
    Sort:
      name: sort
      in: query
      required: false
      description: 'Эрэмбэ: таслалаар тусгаарласан талбар, `-` = буурах. Зөвшөөрөгдсөн талбар resource бүрд (§4.3). Сүүлд
        нь `id` (ledger-т `entryNo`) автоматаар нэмэгдэнэ.'
      schema:
        type: string
        pattern: ^-?[a-zA-Z]+(,-?[a-zA-Z]+){0,3}$
        examples: ['-postingDate,number']
    Q:
      name: q
      in: query
      required: false
      description: 'Хайлт: дугаар, нэр, ТТД-ийн эхлэл (case- ба кирилл/латин-нормчилсон, ≥ 2 тэмдэгт).'
      schema: {type: string, minLength: 2, maxLength: 100}
    PostingDateFrom:
      name: postingDateFrom
      in: query
      required: false
      description: Posting огноо ≥.
      schema: {type: string, format: date}
    PostingDateTo:
      name: postingDateTo
      in: query
      required: false
      description: Posting огноо ≤.
      schema: {type: string, format: date}
    DocumentNoQ:
      name: documentNo
      in: query
      required: false
      description: Баримтын дугаар (яг тэнцүү).
      schema: {type: string, maxLength: 35}
    CustomerIdQ:
      name: customerId
      in: query
      required: false
      description: Харилцагчаар шүүх.
      schema: {type: string, format: uuid}
    VendorIdQ:
      name: vendorId
      in: query
      required: false
      description: Нийлүүлэгчээр шүүх.
      schema: {type: string, format: uuid}
    BankAccountIdQ:
      name: bankAccountId
      in: query
      required: false
      description: Мөнгөний дансаар шүүх.
      schema: {type: string, format: uuid}
    GlAccountIdQ:
      name: glAccountId
      in: query
      required: false
      description: Дансаар шүүх.
      schema: {type: string, format: uuid}
    OpenQ:
      name: open
      in: query
      required: false
      description: Нээлттэй (`remainingAmount ≠ 0`) эсэх.
      schema: {type: boolean}
    BlockedQ:
      name: blocked
      in: query
      required: false
      description: Блоклогдсон эсэхээр шүүх.
      schema: {type: boolean}
    DocStatusQ:
      name: status
      in: query
      required: false
      style: form
      explode: false
      description: Баримтын төлөвөөр (олон утга таслалаар).
      schema: {type: array, items: {$ref: '#/components/schemas/DocumentStatus'}}
    PaymentStatusQ:
      name: paymentStatus
      in: query
      required: false
      style: form
      explode: false
      description: Төлбөрийн төлөвөөр (зөвхөн posted).
      schema: {type: array, items: {$ref: '#/components/schemas/PaymentStatus'}}
    IncludeLines:
      name: include
      in: query
      required: false
      description: '`lines` — жагсаалтад мөрүүдийг оруулах (анхдагчаар оруулахгүй; нэг баримтын GET-д үргэлж орно).'
      schema: {type: string, enum: [lines]}
    DueDateTo:
      name: dueDateTo
      in: query
      required: false
      description: Төлөх огноо ≤.
      schema: {type: string, format: date}
    DocumentTypeQ:
      name: documentType
      in: query
      required: false
      style: form
      explode: false
      description: Баримтын төрлөөр.
      schema: {type: array, items: {$ref: '#/components/schemas/DocumentType'}}
    DateFrom:
      name: dateFrom
      in: query
      required: true
      description: Хугацааны эхлэл (огноо орно).
      schema: {type: string, format: date}
    DateTo:
      name: dateTo
      in: query
      required: true
      description: Хугацааны төгсгөл (огноо орно).
      schema: {type: string, format: date}
    AsOf:
      name: asOf
      in: query
      required: false
      description: Тооцох огноо. Анхдагч өнөөдөр (Asia/Ulaanbaatar).
      schema: {type: string, format: date}
    Dim1Q:
      name: dimension1ValueId
      in: query
      required: false
      description: Global dimension 1-ийн утгаар (FR-RPT-018).
      schema: {type: string, format: uuid}
    Dim2Q:
      name: dimension2ValueId
      in: query
      required: false
      description: Global dimension 2-ийн утгаар.
      schema: {type: string, format: uuid}
    IncludeClosing:
      name: includeClosingEntries
      in: query
      required: false
      description: Жилийн хаалтын (`is_closing`) бичилтийг оруулах (D-D4). Анхдагч `false`.
      schema: {type: boolean, default: false}
    EbarimtPrint:
      name: ebarimtPrint
      in: query
      required: false
      description: '`sync` = B2C баримтыг commit-ийн дараа шууд илгээж хэвлэх өгөгдөл буцаана (12-ebarimt DSP-30). Анхдагч:
        cookie (SPA) бол `sync`, Bearer бол `async`.'
      schema: {type: string, enum: [sync, async]}
    Detail:
      name: detail
      in: query
      required: false
      description: '`true` бол entry бүрийн мөрийг (`entries`) оруулна.'
      schema: {type: boolean, default: false}
    ValidOn:
      name: date
      in: query
      required: false
      description: Хүчинтэй байх огноо. Анхдагч өнөөдөр (Asia/Ulaanbaatar).
      schema: {type: string, format: date}
  headers:
    ETag:
      description: Хувилбарын шошго `"<row_version>"` (§6). Дараагийн бичилтэд `If-Match`-д илгээнэ.
      schema: {type: string, examples: ['"3"']}
    Location:
      description: Үүссэн resource эсвэл job-ийн URL.
      schema: {type: string, format: uri-reference}
    ContentLocation:
      description: Хариуны төлөөллийн canonical URL.
      schema: {type: string, format: uri-reference}
    IdempotentReplayed:
      description: '`true` бол хадгалсан хариуг давтан буцаасан (§7).'
      schema: {type: string, enum: ['true']}
    RetryAfter:
      description: Дахин оролдох хүртэл хүлээх секунд.
      schema: {type: integer, minimum: 0}
    RateLimitLimit:
      description: Цонхны хязгаар (§13).
      schema: {type: integer}
    RateLimitRemaining:
      description: Үлдсэн хүсэлт.
      schema: {type: integer}
    RateLimitReset:
      description: Цонх шинэчлэгдэх хүртэлх секунд.
      schema: {type: integer}
    CacheControlNoStore:
      description: '`no-store` (QR/сугалаатай хариу ба бүх санхүүгийн өгөгдөл).'
      schema: {type: string, enum: [no-store]}
    ContentDisposition:
      description: '`attachment; filename="SI-2026-00001.pdf"`.'
      schema: {type: string}
  responses:
    BadRequest:
      description: 'Хүсэлтийн формат буруу: JSON, төрөл, pattern, мэдэгдэхгүй талбар/параметр, мөнгө number-ээр, cursor (`api.request_invalid`,
        `api.money_must_be_string` …).'
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Unauthorized:
      description: Нэвтрээгүй / session дууссан (`platform.unauthenticated`, `platform.session_expired`).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Forbidden:
      description: Эрхгүй (`platform.permission_denied` + `requiredPermission`), MFA/step-up (`platform.mfa_required`, `platform.reauth_required`),
        тенантын төлөв.
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    NotFound:
      description: Resource эсвэл компани олдсонгүй / хандах эрхгүй (`api.resource_not_found`, `platform.company_not_found`).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Conflict:
      description: Төлөвийн зөрчил (`api.document_not_editable`, `api.document_already_posted`, `api.idempotency_in_progress`,
        давхардал …).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    PreconditionFailed:
      description: '`If-Match` зөрсөн (`api.etag_mismatch`, `currentEtag`-тэй).'
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    PreconditionRequired:
      description: '`If-Match` байхгүй (`api.precondition_required`).'
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    PayloadTooLarge:
      description: Body > 1 MB эсвэл файл > 20 MB (`api.payload_too_large`).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    UnsupportedMediaType:
      description: Content-Type дэмжигдэхгүй (`api.unsupported_media_type`).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    UnprocessableEntity:
      description: Бизнесийн дүрмийн алдаа (домэйн код, жишээ `gl.period_closed`); `errors[]`-д бүх алдаа.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            periodClosed:
              summary: Posting огнооны үе хаалттай ба мөрийн алдаа (бүх алдаа нэг дор)
              value:
                type: https://app.erp.mn/problems/api.validation_failed
                title: Батлах боломжгүй
                status: 422
                detail: Баримтад 2 алдаа байна.
                instance: /api/v1/companies/0199a7f0-1111-7aaa-8bbb-0123456789ab/sales-invoices/0199a8b2-6f1e-7c3a-9d41-2b7e5c0a1f00:post
                code: api.validation_failed
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                errors:
                - code: gl.period_closed
                  message: 2026-09 сар хаагдсан байна.
                  pointer: /postingDate
                  params: {period: '2026-09'}
                - code: ebarimt.classification_code_missing
                  message: 2-р мөрөнд БҮНА код алга.
                  pointer: /lines/1/classificationCode
    TooManyRequests:
      description: Rate limit (`platform.rate_limited`) (§13).
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        RateLimit-Limit: {$ref: '#/components/headers/RateLimitLimit'}
        RateLimit-Remaining: {$ref: '#/components/headers/RateLimitRemaining'}
        RateLimit-Reset: {$ref: '#/components/headers/RateLimitReset'}
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    ServiceUnavailable:
      description: 'Түр боломжгүй: posting түгжээний timeout (`api.lock_timeout`), DB failover. Ижил `Idempotency-Key`-ээр
        дахин.'
      headers: {Retry-After: {$ref: '#/components/headers/RetryAfter'}}
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    ServerError:
      description: Серверийн алдаа (`api.internal_error`, `platform.context_error`).
      content:
        application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}
    Accepted:
      description: Async job хүлээн авлаа (§10). `Location` нь job-ийн URL.
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json: {schema: {$ref: '#/components/schemas/Job'}}
  schemas:
    AccountCategory:
      type: string
      enum: [ASSETS, LIABILITIES, EQUITY, INCOME, COGS, EXPENSE]
      description: Дансны ангилал. Клиент шинэ утгыг тэвчих ёстой (API-VER-03).
    AccountType:
      type: string
      enum: [GL_ACCOUNT, CUSTOMER, VENDOR, BANK_ACCOUNT, FIXED_ASSET]
      description: BC enum 81 (`platform.account_type`). FIXED_ASSET нь R2. Клиент шинэ утгыг тэвчих ёстой (API-VER-03).
    AccountingPeriod:
      type: object
      properties:
        id: {type: string, format: uuid, readOnly: true}
        fiscalYearId: {type: string, format: uuid, readOnly: true}
        fiscalYear: {type: integer, format: int32, readOnly: true}
        name: {type: string, readOnly: true}
        startingDate: {type: string, format: date, readOnly: true}
        endingDate: {type: string, format: date, readOnly: true}
        newFiscalYear: {type: boolean, readOnly: true}
        status: {$ref: '#/components/schemas/PeriodStatus', readOnly: true}
        statusChangedAt: {type: [string, 'null'], format: date-time, readOnly: true}
        statusChangedBy: {type: [string, 'null'], format: uuid, readOnly: true}
        etag: {type: string, readOnly: true}
      required: [id, fiscalYearId, name, startingDate, endingDate, status]
      x-db-table: gl.accounting_period
    AccountingPeriodList:
      type: object
      required: [items, hasMore]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AccountingPeriod'}}
        nextCursor:
          type: [string, 'null']
          description: Дараагийн хуудасны opaque cursor (`?after=`). Сүүлийн хуудсанд `null`.
        hasMore: {type: boolean}
      description: '`AccountingPeriod`-ийн keyset хуудас (§4.1).'
    AgingBucket:
      type: object
      properties:
        sequenceNo: {type: integer, format: int32, readOnly: true}
        label: {type: string, readOnly: true}
        fromDays: {type: [integer, 'null'], format: int32, readOnly: true}
        toDays: {type: [integer, 'null'], format: int32, readOnly: true}
      required: [sequenceNo, label]
    AgingEntry:
      type: object
      properties:
        partyId: {type: string, format: uuid, readOnly: true}
        ledgerEntryId: {type: string, format: uuid, readOnly: true}
        entryNo: {type: integer, format: int64, readOnly: true}
        documentNo: {$ref: '#/components/schemas/DocumentNo', readOnly: true}
        externalDocumentNo: {type: [string, 'null'], readOnly: true}
        dueDate: {type: string, format: date, readOnly: true}
        remainingLcy: {$ref: '#/components/schemas/Amount', readOnly: true}
        daysOverdue: {type: integer, format: int32, readOnly: true}
        bucketSequenceNo: {type: [integer, 'null'], format: int32, readOnly: true}
      required:
      - partyId
      - ledgerEntryId
      - entryNo
      - documentNo
      - dueDate
      - remainingLcy
      - daysOverdue
    AgingReport:
      type: object
      properties:
        asOf: {type: string, format: date, readOnly: true}
        partyType: {type: string, enum: [CUSTOMER, VENDOR], readOnly: true}
        agingBucketSetId: {type: string, format: uuid, readOnly: true}
        basis:
          type: string
          enum: [DUE_DATE, POSTING_DATE, DOCUMENT_DATE]
          readOnly: true
        buckets: {type: array, items: {$ref: '#/components/schemas/AgingBucket'}, readOnly: true}
        rows: {type: array, items: {$ref: '#/components/schemas/AgingRow'}, readOnly: true}
        entries:
          type: array
          items: {$ref: '#/components/schemas/AgingEntry'}
          description: '`detail=true` үед.'
          readOnly: true
        totals:
          $ref: '#/components/schemas/AgingRow'
          description: '`partyId` = nil UUID, нийт.'
          readOnly: true
        generatedAt: {type: string, format: date-time, readOnly: true}
      required: [asOf, partyType, basis, buckets, rows, totals, generatedAt]
      description: Авлага/өглөгийн насжилт (FR-RPT-004/005, D-F7). Дүн LCY; өглөг BC тэмдгээр (сөрөг).
    AgingRow:
      type: object
      properties:
        partyId: {type: string, format: uuid, readOnly: true}
        partyNumber: {$ref: '#/components/schemas/Code20', readOnly: true}
        partyName: {type: string, readOnly: true}
        totalRemaining: {$ref: '#/components/schemas/Amount', readOnly: true}
        bucketAmounts:
          type: array
          items: {$ref: '#/components/schemas/Amount'}
          description: '`buckets`-ийн дарааллаар.'
          readOnly: true
      required: [partyId, partyNumber, partyName, totalRemaining, bucketAmounts]
    Amount:
      type: string
      format: decimal
      pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      description: 'Мөнгөн дүн (`platform.amount` = numeric(19,4)) JSON **string**-ээр. Хариунд валютын нарийвчлалаар (MNT:
        2 орон) гарна, жишээ "1100.00". JSON number ирвэл 400 `api.money_must_be_string`.'
      examples: ['1100.00']
    AmountOrNull:
      type: [string, 'null']
      format: decimal
      pattern: ^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,4})?$
      description: 'Мөнгөн дүн (`platform.amount` = numeric(19,4)) JSON **string**-ээр. Хариунд валютын нарийвчлалаар (MNT:
        2 орон) гарна, жишээ "1100.00". JSON number ирвэл 400 `api.money_must_be_string`. `null` зөвшөөрнө.'
    ApplicationResult:
      type: object
      properties:
        applicationNo: {type: integer, format: int64, readOnly: true}
        postingDate:
          type: string
          format: date
          description: = оролцогчдын хамгийн хожуу posting огноо (FR-PTY-013).
          readOnly: true
        applyingEntry: {$ref: '#/components/schemas/AppliedEntryResult', readOnly: true}
        appliedEntries:
          type: array
          items: {$ref: '#/components/schemas/AppliedEntryResult'}
          readOnly: true
        transactionNo:
          type: [integer, 'null']
          format: int64
          description: MNT-д `null` (G/L-гүй тулгалт); R2 валютын ханшийн зөрүүтэй бол ваучер.
          readOnly: true
      required: [applicationNo, postingDate, applyingEntry, appliedEntries]
    AppliedEntryResult:
      type: object
      properties:
        ledgerEntryId: {type: string, format: uuid, readOnly: true}
        entryNo: {type: integer, format: int64, readOnly: true}
        documentType: {$ref: '#/components/schemas/DocumentType', readOnly: true}
        documentNo: {$ref: '#/components/schemas/DocumentNo', readOnly: true}
        appliedAmount: {$ref: '#/components/schemas/Amount', readOnly: true}
        remainingAmount: {$ref: '#/components/schemas/Amount', readOnly: true}
        open: {type: boolean, readOnly: true}
      required: [ledgerEntryId, entryNo, documentNo, appliedAmount, remainingAmount, open]
    ApplyRequest:
      type: object
      additionalProperties: false
      properties:
        applyingEntryId:
          type: string
          format: uuid
          description: Тулгаж буй entry (ихэвчлэн төлбөр/кредит нот; BC Applying Entry).
        entries:
          type: array
          items: {$ref: '#/components/schemas/ApplyToEntry'}
          description: Тулгагдах entry-үүд. Хоосон + `allocation = DUE_DATE` бол бүх нээлттэй.
        allocation:
          type: string
          enum: [MANUAL, DUE_DATE]
          description: MANUAL = `entries`-ийн дарааллаар; DUE_DATE = төлөх огноо эртийнхээс (FR-PTY-010).
        postingDate:
          type: [string, 'null']
          format: date
          description: Тулгалтын огноо. Анхдагч = оролцогч entry-үүдийн хамгийн хожуу `posting_date`; түүнээс эрт бол 422 `party.application_date_before_entries`; үе/цонх нээлттэй байх (06 BR-AR-27, FR-PTY-013).
      required: [applyingEntryId]
    ApplyToEntry:
      type: object
      additionalProperties: false
      properties:
        ledgerEntryId:
          type: string
          format: uuid
          description: Харилцагч/нийлүүлэгчийн нээлттэй entry.
        amountToApply:
          $ref: '#/components/schemas/AmountOrNull'
          description: Эерэг дүн; `null` = боломжит бүх үлдэгдэл.
      required: [ledgerEntryId]
    AutoMatchResult:
      type: object
      properties:
        matchedLines: {type: integer, format: int32, readOnly: true}
        high: {type: integer, format: int32, readOnly: true}
        medium: {type: integer, format: int32, readOnly: true}
        low: {type: integer, format: int32, readOnly: true}
        unmatched: {type: integer, format: int32, readOnly: true}
      required: [matchedLines, high, medium, low, unmatched]
    BalanceCheck:
      type: object
      properties:
        ok:
          type: boolean
          description: эхний + Σ мөр = эцсийн (FR-BNK-008 AC1).
          readOnly: true
        difference: {$ref: '#/components/schemas/Amount', readOnly: true}
      required: [ok, difference]
    BankAccount:
      type: object
      properties:
        id: {type: string, format: uuid, readOnly: true}
        number: {$ref: '#/components/schemas/Code20'}
        name: {type: string}
        kind: {$ref: '#/components/schemas/BankAccountKind'}
        bankName: {type: [string, 'null']}
        bankCode: {type: [string, 'null']}
        bankAccountNo:
          type: [string, 'null']
          description: CASH-д null.
        iban: {type: [string, 'null'], pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{8,30}$'}
        currencyCode: {$ref: '#/components/schemas/CurrencyCodeOrNull'}
        bankAccountPostingGroupId:
          type: string
          format: uuid
          description: → G/L данс (давхардахгүй, FR-BNK-001).
        glAccountId: {type: string, format: uuid, readOnly: true}
        importFormatId: {type: [string, 'null'], format: uuid}
        lastStatementNo: {type: [string, 'null'], readOnly: true}
        balanceLastStatement: {$ref: '#/components/schemas/Amount', readOnly: true}
        matchToleranceType: {type: string, enum: [AMOUNT, PERCENTAGE]}
        matchToleranceValue: {type: string, pattern: '^[0-9]{1,14}(\.[0-9]{1,5})?$'}
        minBalance: {$ref: '#/components/schemas/Amount'}
        preventNegativeBalance:
          type: boolean
          description: CASH-д үргэлж true (D-G1).
        blocked: {type: boolean}
        balance:
          $ref: '#/components/schemas/Amount'
          description: Σ bank ledger entry (дансны валютаар).
          readOnly: true
        balanceLcy: {$ref: '#/components/schemas/Amount', readOnly: true}
        etag:
          type: string
          description: '`ETag` header-тэй ижил утга, жишээ `"3"` (§6).'
          readOnly: true
        createdAt: {type: string, format: date-time, readOnly: true}
        createdBy: {type: [string, 'null'], format: uuid, readOnly: true}
        updatedAt: {type: [string, 'null'], format: date-time, readOnly: true}
      required: [id, number, name]
      description: Банк/касс/хэтэвч (BC T270, D-G1).
      x-db-table: bank.bank_account
    BankAccountCreate:
      type: object
      additionalProperties: false
      properties:
        number: {$ref: '#/components/schemas/Code20'}
        name: {type: string}
        kind: {$ref: '#/components/schemas/BankAccountKind'}
        bankName: {type: [string, 'null']}
        bankCode: {type: [string, 'null']}
        bankAccountNo:
          type: [string, 'null']
          description: CASH-д null.
        iban: {type: [string, 'null'], pattern: '^[A-Z]{2}[0-9]{2}[A-Z0-9]{8,30}$'}
        currencyCode: {$ref: '#/components/schemas/CurrencyCodeOrNull'}
        bankAccountPostingGroupId:
          type: string
          format: uuid
          description: → G/L данс (давхардахгүй, FR-BNK-001).
        importFormatId: {type: [string, 'null'], format: uuid}
        matchToleranceType: {type: string, enum: [AMOUNT, PERCENTAGE]}
