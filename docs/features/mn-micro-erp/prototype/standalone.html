    add('INV-04', 'Үлдэгдэл = detailed бичилтийн нийлбэр', badRem.length === 0, (S.cle.length + S.vle.length) + ' бичилт шалгав; зөрүүтэй: ' + badRem.length, 'INV-04, D-F3');
    var over = S.cle.concat(S.vle).filter(function (e) { return Math.abs(e.remaining) > Math.abs(e.amount) || (e.remaining !== 0 && Math.sign(e.remaining) !== Math.sign(e.amount)); });
    add('INV-26', 'Хэтрүүлж тулгаагүй (|үлдэгдэл| ≤ |дүн|, тэмдэг хадгалагдсан)', over.length === 0, 'Зөрчил: ' + over.length, 'INV-26, BR-AR-06');
    // VAT entries = VAT control accounts
    var vatSum = S.vatEntries.reduce(function (s, e) { return s + e.amount; }, 0);
    var vatGl = glBalance('2300') + glBalance('1300');
    add('VAT-GL', 'НӨАТ-ын бичилт = 2300 + 1300 дансны үлдэгдэл', vatSum === vatGl, 'Σ VAT entry ' + fmtCents(vatSum) + ' · G/L ' + fmtCents(vatGl), 'BR-TAX-28, BR-PST-36');
    // VAT return per period = VAT entries
    var vrBad = [];
    S.vatPeriods.forEach(function (p) {
      if (p.start > D.meta.today) return;
      var vr = vatReturn(p.period);
      var sale = -S.vatEntries.filter(function (e) { return e.type === 'SALE' && e.category === 'VAT10' && monthOf(e.vatDate) === p.period; }).reduce(function (s, e) { return s + e.amount; }, 0);
      var ded = S.vatEntries.filter(function (e) { return e.type === 'PURCHASE' && e.vatBus === 'DOMESTIC' && e.vatProd === 'VAT10' && e.deductibleConfirmed && monthOf(e.vatDate) === p.period; }).reduce(function (s, e) { return s + e.amount; }, 0);
      if (vr.values['2'] !== sale || vr.values['12'] !== -ded || vr.values['14'] !== sale - ded) vrBad.push(p.period);
      if (p.settlementNet !== null && p.settlementNet !== vr.values['14']) vrBad.push(p.period + ' (хаалт)');
    });
    add('VAT-RETURN', 'ТТ-03а мөр 2, 12, 14 = НӨАТ-ын бичилт; хаалтын дүн = мөр 14', vrBad.length === 0, vrBad.length ? 'Зөрүүтэй үе: ' + vrBad.join(', ') : 'Бүх үе тэнцсэн', 'D-E8, FR-TAX-013');
    // document VAT = VAT entries = eBarimt total VAT
    var docBad = [];
    S.salesInvoices.concat(S.salesCrMemos).forEach(function (p) {
      var ve = S.vatEntries.filter(function (e) { return e.transactionNo === p.transactionNo; }).reduce(function (s, e) { return s + e.amount; }, 0);
      var expect = p.docType === 'INVOICE' ? -p.vatAmount : p.vatAmount;
      var lineSum = p.lines.reduce(function (s, l) { return s + l.vat; }, 0);
      if (ve !== expect || lineSum !== p.vatAmount) docBad.push(p.no);
      if (p.docType === 'INVOICE' && p.ebarimtDocId) {
        var d = E.ebarimt.get(p.ebarimtDocId);
        if (d.totals && (d.totals.vat !== p.vatAmount || d.totals.amount !== p.amountInclVat)) docBad.push(p.no + ' (eBarimt)');
      }
    });
    add('BR-TAX-37', 'Баримтын НӨАТ = мөрийн НӨАТ-ын нийлбэр = VAT entry = eBarimt totalVAT', docBad.length === 0, docBad.length ? docBad.join(', ') : (S.salesInvoices.length + S.salesCrMemos.length) + ' баримт тэнцсэн', 'BR-SAL-23, BR-TAX-37, AMT-05');
    var chainBad = S.ebarimtDocs.filter(function (d) { var r = d.operation === 'DELETE' ? null : E.ebarimt.buildRequest(d); return r && !receiptChainOk(r).ok; });
    add('AMT-03', 'eBarimt нийлбэрийн гинж (qty × unitPrice = totalAmount; Σ items = receipt; Σ payments = total)', chainBad.length === 0, S.ebarimtDocs.length + ' баримт; алдаатай: ' + chainBad.length, '12 AMT-03');
    // balance sheet
    var sbt = financialStatement('SBT', {});
    var a = sbt.values.end['1.3'], le = sbt.values.end['2.3'];
    add('SBT', 'СБТ: хөрөнгө = өр төлбөр + эздийн өмч (тайлант үеийн ашиг орно)', a + le === 0 && sbt.values.begin['1.3'] + sbt.values.begin['2.3'] === 0,
      'Хөрөнгө ' + fmtCents(a) + ' = Өр + өмч ' + fmtCents(-le), 'FR-RPT-008, R-45');
    var mgt = financialStatement('MGT', {});
    add('MGT', 'МГТ: эцсийн мөнгө = дэвтрийн мөнгөн хөрөнгө; ангилаагүй (X) = 0', mgt.values.cur['CHK'] === 0 && (mgt.values.cur['X'] || 0) === 0,
      'МГТ 7 = ' + fmtCents(mgt.values.cur['7']) + ' · дэвтэр ' + fmtCents(mgt.values.cur['LEDGER']) + ' · X = ' + fmtCents(mgt.values.cur['X'] || 0), 'FR-RPT-011, BR-PER-39');
    // ODT net profit = −Σ income statement accounts
    var odt = financialStatement('ODT', {});
    var plSum = glBalance(function (n) { return n >= '5000'; }, D.meta.today, D.fiscalYear.year + '-01-01');
    add('ODT', 'ОДТ 22 (цэвэр ашиг) = орлого, зардлын дансны нийлбэр', odt.values.cur['22'] === plSum, 'ОДТ 22 ' + fmtCents(-odt.values.cur['22']) + ' · данс ' + fmtCents(-plSum), 'FR-RPT-009');
    // INV-08 gapless numbering
    var gaps = [];
    var used = {};
    S.transactions.forEach(function (t) { if (t.documentNo) used[t.documentNo] = true; });
    S.cashVouchers.forEach(function (c) { used[c.no] = true; });
    Object.keys(S.series).forEach(function (k) {
      var code = k.split('|')[0], y = k.split('|')[1], def = D.numberSeries[code];
      for (var i = 1; i <= S.series[k].last; i++) { var no = def.prefix + '-' + y + '-' + String(i).padStart(def.width, '0'); if (!used[no]) gaps.push(no); }
    });
    add('INV-08', 'Хуулийн дугаар завсаргүй (SI, SC, PI, KO, KZ, BR, BP, GJ, OB)', gaps.length === 0, Object.keys(S.series).map(function (k) { return k.split('|')[0] + ' ' + S.series[k].last; }).join(' · ') + (gaps.length ? ' · завсар: ' + gaps.join(', ') : ''), 'D-C7, INV-08');
    var en = S.glEntries.map(function (e) { return e.entryNo; });
    var contiguous = en.every(function (n, i) { return n === i + 1; });
    add('INV-09', 'Entry / transaction дугаар дараалсан, давхардалгүй', contiguous && S.transactions.every(function (t, i) { return t.transactionNo === i + 1; }), 'G/L 1..' + en.length + ', гүйлгээ 1..' + S.transactions.length, 'INV-09, BR-PST-28');
    var leak = deepHasKey(S, ['qrData', 'lottery'], 'state');
    add('INV-15', 'qrData / lottery хаана ч хадгалагдаагүй', !leak, leak ? 'Олдсон: ' + leak : 'Төлөвийн бүх объектыг шалгав', 'D-J3, INV-15');
    var negCash = [];
    D.bankAccounts.filter(function (b) { return b.preventNegative; }).forEach(function (b) {
      var bal = 0;
      S.ble.filter(function (x) { return x.bank === b.no; }).sort(function (x, y) { return x.postingDate < y.postingDate ? -1 : x.postingDate > y.postingDate ? 1 : x.entryNo - y.entryNo; })
        .forEach(function (x) { bal += x.amount; if (bal < 0) negCash.push(b.no + ' ' + x.postingDate); });
    });
    add('INV-19', 'Касс сөрөг үлдэгдэлгүй (огноо бүрээр)', negCash.length === 0, negCash.length ? negCash.join(', ') : 'Кассын хамгийн бага үлдэгдэл сөрөг биш', 'D-G1, INV-19');
    return checks;
  }
  E.invariants = invariants;

  // ===========================================================================
  // 15. Boot: post the source transactions in date order
  // ===========================================================================
  var PRIORITY = { journal: 1, purchaseInvoice: 1, salesInvoice: 1, salesCreditMemo: 2, receipt: 3, vendorPayment: 3, bankGl: 3, transfer: 3, vatPayment: 3, vatSettlement: 9 };
  function postSource(x) {
    var r;
    switch (x.t) {
      case 'journal': r = postJournal(x); break;
      case 'salesInvoice':
      case 'salesCreditMemo': {
        var d = newDraft(x.cust, { no: 'SRC-' + x.id, docType: x.t === 'salesInvoice' ? 'INVOICE' : 'CREDIT_MEMO', documentDate: x.date, postingDate: x.date, lines: x.lines,
          appliesTo: x.appliesTo ? (S.refs[x.appliesTo] ? S.refs[x.appliesTo].docNo : null) : null, reason: x.reason || null });
        r = postSalesDraft(d, { ref: x.id, ebarimt: x.ebarimt, ebarimtError: x.ebarimtError, interactive: false });
        if (r.ok) S.refs[x.id] = { kind: 'CLE', entryNo: r.posted.cleEntryNo, docNo: r.posted.no };
        break;
      }
      case 'purchaseInvoice': r = postPurchaseInvoice(x); break;
      case 'receipt': r = postReceipt(x); break;
      case 'vendorPayment': r = postVendorPayment(x); break;
      case 'bankGl': r = postBankGl(x); break;
      case 'transfer': r = postTransfer(x); break;
      case 'vatSettlement': r = vatSettle(x.period, x.date); break;
      case 'vatPayment': r = vatPay(x.period, x.date, x.bank); break;
      default: r = { ok: false, errors: [{ code: 'unknown', message: x.t }] };
    }
    if (!r.ok) throw new Error('Source ' + (x.id || x.t) + ' ' + x.date + ' failed: ' + r.errors.map(function (e) { return e.code + ' ' + e.message; }).join('; '));
    return r;
  }
  function boot() {
    D = ERP.data;
    SET = buildSetup();
    S = emptyState();
    var src = D.sources.map(function (x, i) { return { x: x, i: i }; });
    src.sort(function (a, b) {
      if (a.x.date !== b.x.date) return a.x.date < b.x.date ? -1 : 1;
      var pa = PRIORITY[a.x.t], pb = PRIORITY[b.x.t];
      if (a.x.t === 'journal' && a.x.source === 'OPENING') pa = 0;
      if (b.x.t === 'journal' && b.x.source === 'OPENING') pb = 0;
      return pa !== pb ? pa - pb : a.i - b.i;
    });
    src.forEach(function (o) { postSource(o.x); });
    // period / VAT period statuses after the history (D-D3)
    S.periods.forEach(function (p) { p.status = D.fiscalYear.periodStatus[p.period.slice(5, 7)] || 'OPEN'; });
    S.vatPeriods.forEach(function (p) { var st = D.fiscalYear.vatPeriodStatus[p.period.slice(5, 7)]; if (st === 'SUBMITTED') p.status = 'SUBMITTED'; });
    // bank entries up to the last reconciliation are matched to statements
    S.ble.forEach(function (b) { var thr = D.reconciledThrough[b.bank]; if (thr && b.postingDate <= thr) b.statementStatus = 'CLOSED'; });
    // drafts
    D.drafts.forEach(function (dr) { var d = newDraft(dr.customer, { no: dr.no, documentDate: dr.documentDate, postingDate: dr.postingDate, lines: dr.lines, createdBy: dr.createdBy, note: dr.note }); S.drafts.push(d); });
    return E;
  }
  E.boot = boot;
  E.state = function () { return S; };
  E.periods = { list: function () { return S.periods; }, of: periodOf, vatOf: vatPeriodOf,
    setStatus: function (period, status) { var p = S.periods.filter(function (x) { return x.period === period; })[0]; if (p) p.status = status; return p; } };
  E.version = '0.1.0';
})();

<script>/* ===== js/annotations.js ===== */
/* =============================================================================
   js/annotations.js — window.ERP.notes: the explanation ("Тайлбар") framework + shell notes.

   A note explains one UI element. Elements opt in with data-note="<id>"; app.js puts numbered hotspot
   markers on them while explanation mode is on and opens the right-hand panel on click.

   Note shape (all text in Mongolian):
     {
       title: 'Гарчиг',
       what:  'Юу хийдэг вэ — plain language for a business owner',
       why:   'Яагаад — business / legal reason',
       bc:    'BC-д — the Business Central object it mirrors (e.g. Table 17 G/L Entry)',
       rules: ['BR-SAL-22', 'D-E3', 'FR-TAX-004'],        // rule ids from the specs
       data:  ['gl.gl_entry.amount', ...],                  // db tables / columns (db/schema)
       doc:   [{ file: '06-sales-receivables.md', section: '6.3 НӨАТ — үнэ НӨАТ-гүй (`prices_including_vat = false`)' }]
     }
   doc.section must be the exact heading text (without the leading #'s); the link anchor is computed with the
   GitHub slug rules, and tests/engine_check.js verifies that every heading exists.

   Registration (per screen, from js/notes/<area>.js):
     ERP.notes.register('sales', 'Борлуулалтын нэхэмжлэх', { 'sales.customer': {...}, ... });
   ========================================================================== */
(function () {
  'use strict';
  var ERP = (window.ERP = window.ERP || {});
  var items = {};        // id → note
  var screens = [];      // [{ screen, title, ids: [] }]

  function slug(text) {                      // GitHub heading anchor
    var t = String(text)
      .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')  // [label](link) → label
      .replace(/`/g, '')
      .trim()
      .toLowerCase();
    t = t.replace(/[^\p{L}\p{N}\p{M}\s_-]/gu, '');
    return t.replace(/ /g, '-');
  }
  function link(doc) {
    var base = doc.file.indexOf('db/') === 0 || doc.file.indexOf('adr/') === 0 ? '../' + doc.file : '../' + doc.file;
    return base + (doc.section ? '#' + slug(doc.section) : '');
  }

  ERP.notes = {
    register: function (screen, title, notes) {
      var s = screens.filter(function (x) { return x.screen === screen; })[0];
      if (!s) { s = { screen: screen, title: title, ids: [] }; screens.push(s); }
      Object.keys(notes).forEach(function (id) {
        var n = notes[id];
        n.id = id; n.screen = screen;
        n.rules = n.rules || []; n.data = n.data || [];
        n.doc = n.doc ? (Array.isArray(n.doc) ? n.doc : [n.doc]) : [];
        items[id] = n;
        if (s.ids.indexOf(id) < 0) s.ids.push(id);
      });
    },
    get: function (id) { return items[id] || null; },
    all: function () { return Object.keys(items).map(function (k) { return items[k]; }); },
    byScreen: function () { return screens.map(function (s) { return { screen: s.screen, title: s.title, notes: s.ids.map(function (i) { return items[i]; }) }; }); },
    slug: slug,
    link: link
  };

  // ---------------------------------------------------------------------------
  // Shell notes (top bar, navigation, prototype pages)
  // ---------------------------------------------------------------------------
  ERP.notes.register('shell', 'Програмын хүрээ (бүх дэлгэц)', {

      why: 'Хөгжүүлэгч, нягтлан, бизнес эзэн гурвуулаа ижил жишээн дээр ярилцаж, тооцоо зөв эсэхийг шалгах боломжтой. Бодит өгөгдөл ашиглахгүй тул хувийн мэдээлэл задрахгүй.',
      bc: 'BC-ийн CRONUS демо компани (Company.IsDemo / "ТУРШИЛТ" badge) -тай адил санаа.',
      rules: ['UX-NAV-04', 'D-A1'],

      doc: [{ file: 'db/seed/README.md', section: '3.2 Дансны жагсаалт' }, { file: '15-ui-ux.md', section: '2.2 Навигацийн дүрэм' }]
    },

      title: 'Тайлбарын горим',

      why: 'Прототипийг үзсэн хүн дэлгэц бүрийн цаадах нягтлан бодох логикийг хөгжүүлэлтийн баримттай шууд холбож ойлгох шаардлагатай.',
      bc: 'BC-д байхгүй. Ойролцоо нь tooltip ба "Learn more" холбоос.',
      rules: ['UXP-03'],
      data: [],
      doc: [{ file: '15-ui-ux.md', section: '1.2 UX зарчим' }]
    },
    'shell.role': {

      why: 'BC-ийн Role Center нь эрх биш, зөвхөн харагдац. Эрхийг сервер шалгана; энд үүрэг солих нь зөвхөн нүүрийн хувилбарыг солино.',
      bc: 'Profile / Role Center (Page 9022 Business Manager RC, Page 9027 Accountant RC).',
      rules: ['UX-HOME-01', 'D-I2', 'FR-PLT-005'],
      data: ['platform.user_company_role', 'platform.role'],
      doc: [{ file: '15-ui-ux.md', section: '3.1 Нүүр хуудсын хувилбар сонгох' }, { file: '13-security-audit-tenancy.md', section: '6.5 Built-in role (тенант бүрд provisioning-ээр, `is_builtin = true`)' }]
    },
    'shell.nav': {
      title: 'Цэсийн мод',

      why: 'Бичил бизнесийн хэрэглэгч ихэвчлэн баримт (нэхэмжлэх, кассын баримт) бичдэг; гар журнал нь нягтлангийн хэрэгсэл тул доор байрлана.',
      bc: 'Role Center-ийн navigation menu (Sales, Purchasing, Cash Management, Finance).',
      rules: ['UXP-01', 'UX-NAV-05', 'UX-NAV-06'],
      data: [],
      doc: [{ file: '15-ui-ux.md', section: '2.3 Цэсийн мод (монгол)' }]
    },
    'checks.list': {
      title: 'Хөдөлгүүрийн инвариант',
      what: 'Энэ хуудас дэлгэц нээгдэх бүрд бүх ledger-ийг дахин шалгана: гүйлгээ бүр тэнцсэн эсэх, авлага/өглөг/банкны дэд дэвтэр хяналтын данстайгаа тэнцэх эсэх, НӨАТ-ын тайлан VAT entry-тэй, баланс тэнцэх эсэх гэх мэт. Шинэ нэхэмжлэх батлаад энд ирэхэд шалгалт дахин ажиллана.',
      why: 'Бодит системд эдгээрийг DB-ийн trigger, CHECK ба шөнийн бүрэн бүтэн байдлын шалгалт хангана. Прототипт ижил дүрмийг JavaScript-ээр давтаж, тооцоолол зөв болохыг нотолно.',
      bc: 'CU12 Gen. Jnl.-Post Line-ийн тэнцлийн шалгалт, Report 6 Trial Balance, "G/L - Receivables" тулгалт.',
      rules: ['INV-01', 'INV-04', 'INV-08', 'INV-11', 'INV-15', 'INV-19', 'D-C5', 'FR-GL-028'],
      data: ['gl.gl_entry', 'party.v_receivables_reconciliation', 'tax.vat_entry'],
      doc: [{ file: '03-domain-model.md', section: '5. Гол инвариантууд (invariants)' }]
    },
    'notes.list': {

      why: 'Баримт бичигтэй уялдааг (traceability) нэг дороос хянах боломж.',
      bc: '—',
      rules: [],
      data: [],
      doc: [{ file: '15-ui-ux.md', section: '15. Дэлгэцийн жагсаалт (screen inventory)' }]
    }
  });
})();

<script>/* ===== js/app.js ===== */
/* =============================================================================
   js/app.js — window.ERP.app (shell, router, explanation mode) and window.ERP.ui (shared UI helpers).

   Screens register themselves from js/screens/*.js (loaded after this file):
     ERP.app.registerScreen({
       route: 'sales-invoice',            // bare #token, never #a=b
       title: 'Борлуулалтын нэхэмжлэх',
       crumbs: [['Борлуулалт'], ['Нэхэмжлэх', 'sales-invoices']],
       intro: ['2–4 sentences: purpose, who uses it, what happens on post'],
       owner: 'js/screens/sales.js',
       render: function (el, ctx) { ... },  // el = empty container; ctx = ERP.app.ctx (shared navigation context)
       onLeave: function () { ... }         // optional
     });
   Placeholders for later builders: ERP.app.stub({ route, title, crumbs, intro, owner, plan: [...] }).
   ========================================================================== */
(function () {
  'use strict';
  var ERP = (window.ERP = window.ERP || {});
  var E = null;
  var LS = {
    get: function (k, d) { try { var v = window.localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage blocked: keep defaults */ } }
  };

  // ===========================================================================
  // ERP.ui — helpers shared by every screen
  // ===========================================================================
  var ui = (ERP.ui = {});
  ui.esc = function (s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  ui.money = function (c, opts) { return E.money.fmt(c, opts); };                    // "1 234 567.00" (+ " ₮" with {sym:true})
  ui.moneyCell = function (c, opts) { return '<td class="num' + (c < 0 && opts && opts.negRed ? ' neg' : '') + '">' + ui.esc(E.money.fmt(c, opts)) + '</td>'; };
  ui.date = function (d) { return E.dates.fmt(d); };
  // date input in YYYY.MM.DD (15 §7.4 subset): '2026.10.05', '2026-10-05', '20261005', 'т' / 'ө' = today
  ui.parseDate = function (raw) {
    var t = String(raw || '').trim().toLowerCase();
    if (t === 'т' || t === 'ө' || t === 't') return ERP.data.meta.today;
    var m = /^(\d{4})[.\-\/ ]?(\d{1,2})[.\-\/ ]?(\d{1,2})$/.exec(t);
    if (!m) return null;
    var y = +m[1], mo = +m[2], d = +m[3];
    var dt = new Date(Date.UTC(y, mo - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d || y < 2000 || y > 2200) return null;
    return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0');
  };
  ui.dateInput = function (id, iso, extra) {
    return '<input class="input mono" type="text" inputmode="numeric" id="' + id + '" value="' + ui.esc(ui.date(iso || '')) + '" placeholder="ЖЖЖЖ.СС.ӨӨ" maxlength="10" autocomplete="off"' + (extra || '') + '>';
  };
  ui.$ = function (sel, root) { return (root || document).querySelector(sel); };
  ui.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  ui.html = function (el, s) { el.innerHTML = s; return el; };
  ui.frag = function (s) { var t = document.createElement('template'); t.innerHTML = s.trim(); return t.content.firstElementChild; };

  var PILLS = {
    DRAFT: ['draft', '✎', 'Ноорог'], RELEASED: ['info', '☐', 'Бэлэн'], POSTED: ['ok', '●', 'Бичигдсэн'],
    UNPAID: ['info', '○', 'Төлөгдөөгүй'], OVERDUE: ['danger', '⚠', 'Хугацаа хэтэрсэн'], PARTIALLY_PAID: ['warn', '◐', 'Хэсэгчлэн төлөгдсөн'],
    PAID: ['ok', '●', 'Төлөгдсөн'], CANCELLED: ['cancelled', '⊘', 'Цуцлагдсан'], CORRECTIVE: ['neutral', '↺', 'Залруулгын кредит нот'],
    PENDING: ['info', '⏳', 'Хүлээгдэж буй'], SENT: ['info', '⟳', 'Илгээсэн'], SUCCESS: ['ok', '✓', 'Бүртгэгдсэн'],
    ERROR: ['danger', '✕', 'Алдаа'], UNKNOWN: ['danger', '?', 'UNKNOWN · тодорхойгүй'], CORRECTED: ['neutral', '↺', 'Засварлагдсан'],
    VOIDED: ['neutral', '⊘', 'Цуцлагдсан'], NOT_REQUIRED: ['neutral', '—', 'Шаардлагагүй'], NOT_CONFIGURED: ['warn', '⚠', 'Тохируулаагүй'],
    OPEN: ['info', '○', 'Нээлттэй'], CLOSED: ['neutral', '■', 'Хаалттай'], LOCKED: ['neutral', '🔒', 'Түгжсэн'], SUBMITTED: ['ok', '✓', 'Илгээсэн'],
    PASS: ['ok', '✓', 'PASS'], FAIL: ['danger', '✕', 'FAIL'], OK: ['ok', '✓', 'Хэвийн'], WARNING: ['warn', '◐', 'Анхаарах'], BLOCKING: ['danger', '⚠', 'Хаалт зогсооно']
  };
  ui.pill = function (status, text) {
    var p = PILLS[status] || ['neutral', '', status];
    return '<span class="pill ' + p[0] + '" title="' + ui.esc(text || p[2]) + '"><span class="ic" aria-hidden="true">' + p[1] + '</span>' + ui.esc(text || p[2]) + '</span>';
  };
  ui.pillLabel = function (status) { return (PILLS[status] || [0, 0, status])[2]; };

  ui.calc = function (summary, bodyHtml, id) {          // "Тооцоог харах" expander
    return '<details class="calc"' + (id ? ' id="' + id + '"' : '') + '><summary>' + ui.esc(summary || 'Тооцоог харах') + '</summary><div class="calc-body">' + bodyHtml + '</div></details>';
  };
  ui.errList = function (errors, title) {
    if (!errors || !errors.length) return '';
    return '<div class="errlist" role="alert"><h3>' + ui.esc(title || 'Батлах боломжгүй — дараах алдааг засна уу') + '</h3><ul>' +
      errors.map(function (e) { return '<li><code>' + ui.esc(e.code) + '</code> — ' + ui.esc(e.message) + '</li>'; }).join('') + '</ul></div>';
  };
  ui.warnList = function (warnings) {
    if (!warnings || !warnings.length) return '';
    return '<div class="banner warn"><strong>Анхааруулга:</strong> ' + warnings.map(function (w) { return ui.esc(w.message) + ' <code>' + ui.esc(w.code) + '</code>'; }).join('<br>') + '</div>';
  };
  ui.json = function (obj) {                            // syntax-highlighted JSON (keys keep their order)
    var ind = function (n) { return '  '.repeat(n); };
    var f = function (v, n, key) {                      // amounts as numbers with exactly 2 decimals (12 AMT-21); qty / ids as is
      if (v === null) return '<span class="z">null</span>';
      if (typeof v === 'number') return '<span class="n">' + (key === 'qty' || key === 'posId' ? String(v) : v.toFixed(2)) + '</span>';
      if (typeof v === 'string') return '<span class="s">"' + ui.esc(v) + '"</span>';
      if (typeof v === 'boolean') return '<span class="n">' + v + '</span>';
      if (Array.isArray(v)) return v.length ? '[\n' + v.map(function (x) { return ind(n + 1) + f(x, n + 1); }).join(',\n') + '\n' + ind(n) + ']' : '[]';
      var ks = Object.keys(v);
      return '{\n' + ks.map(function (k) { return ind(n + 1) + '<span class="k">"' + ui.esc(k) + '"</span>: ' + f(v[k], n + 1, k); }).join(',\n') + '\n' + ind(n) + '}';
    };
    return '<pre class="json">' + f(obj, 0) + '</pre>';
  };
  ui.copy = function (text, btn) {
    var done = function () { if (btn) { var t = btn.textContent; btn.textContent = 'Хуулагдлаа'; setTimeout(function () { btn.textContent = t; }, 1400); } };
    try {
      navigator.clipboard.writeText(text).then(done, function () { ui.toast('Хуулах боломжгүй байна. Текстийг сонгоод Ctrl+C дарна уу.'); });
    } catch (e) { ui.toast('Хуулах боломжгүй байна. Текстийг сонгоод Ctrl+C дарна уу.'); }
  };

  ui.toast = function (msg, kind) {
    var host = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast' + (kind === 'error' ? ' error' : '');
    t.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    t.innerHTML = msg;
    host.appendChild(t);
    setTimeout(function () { t.remove(); }, 5200);
  };

  // modal: { title, body (html string or Node), wide, footer: [{ label, kind:'primary'|'danger'|'', id, onClick(close) }], onRequestClose: () => Promise<bool> }
  ui.modal = function (o) {
    var prevFocus = document.activeElement;
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="modal' + (o.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="m-title-' + (ui._mid = (ui._mid || 0) + 1) + '">' +
      '<div class="m-head"><h2 id="m-title-' + ui._mid + '">' + ui.esc(o.title) + '</h2><button class="btn ghost sm" data-close aria-label="Хаах">✕</button></div>' +
      '<div class="m-body"></div><div class="m-foot"></div></div>';
    var body = ov.querySelector('.m-body'), foot = ov.querySelector('.m-foot');
    if (typeof o.body === 'string') body.innerHTML = o.body; else if (o.body) body.appendChild(o.body);
    var closed = false;
    var close = function (force) {
      if (closed) return Promise.resolve(true);
      var go = function () { closed = true; ov.remove(); document.removeEventListener('keydown', onKey, true); if (o.onClose) o.onClose(); if (prevFocus && prevFocus.focus) prevFocus.focus(); return true; };
      if (!force && o.onRequestClose) return o.onRequestClose().then(function (ok) { return ok ? go() : false; });
      return Promise.resolve(go());
    };
    (o.footer || [{ label: 'Хаах' }]).forEach(function (b) {
      var btn = document.createElement('button');
      btn.className = 'btn' + (b.kind ? ' ' + b.kind : '');
      btn.type = 'button';
      if (b.id) btn.id = b.id;
      btn.textContent = b.label;
      btn.addEventListener('click', function () { if (b.onClick) b.onClick(close); else close(); });
      foot.appendChild(btn);
    });
    ov.querySelector('[data-close]').addEventListener('click', function () { close(); });
    var onKey = function (ev) { if (ev.key === 'Escape') { ev.stopPropagation(); close(); } };
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(ov);
    var first = foot.querySelector('.btn.primary') || foot.querySelector('.btn');
    if (first) first.focus();
    return { el: ov, body: body, close: close };
  };
  ui.confirm = function (o) {                           // in-page confirm (window.confirm is unavailable)
    return new Promise(function (resolve) {
      var answered = false;
      ui.modal({ title: o.title || 'Баталгаажуулах', body: '<div class="stack">' + (o.body || '') + '</div>',
        footer: [{ label: o.cancel || 'Болих', onClick: function (close) { answered = true; close(true); resolve(false); } },
          { label: o.ok || 'Тийм', kind: o.danger ? 'danger' : 'primary', id: 'confirm-ok', onClick: function (close) { answered = true; close(true); resolve(true); } }],
        onClose: function () { if (!answered) resolve(false); } });
    });
  };

  // ===========================================================================
  // ERP.app — shell, router, explanation mode
  // ===========================================================================
  var app = (ERP.app = { screens: {}, ctx: {}, state: { role: 'OWNER', notesOn: true, theme: 'system' }, current: null });

  // Information architecture (15 §2.3), reduced to the prototype's routes
  var NAV = [
    { label: 'Нүүр', route: 'home', single: true },
    { label: 'Борлуулалт', items: [['Нэхэмжлэх', 'sales-invoices'], ['Харилцагч', 'customers'], ['eBarimt хяналт', 'ebarimt']] },
    { label: 'Худалдан авалт', items: [['Нэхэмжлэх', 'purchase-invoices']] },
    { label: 'Мөнгө', items: [['Кассын баримт (МХ-1/МХ-2)', 'cash'], ['Хуулга ба тулгалт', 'bank-rec']] },
    { label: 'Санхүү', items: [['Ерөнхий журнал', 'journal'], ['Дансны төлөвлөгөө', 'coa']] },
    { label: 'Татвар', items: [['НӨАТ-ын тайлан (ТТ-03а)', 'vat-return']] },
    { label: 'Хаалт', items: [['Санхүүгийн жил ба үе', 'periods']] },
    { label: 'Тайлан', items: [['Гүйлгээ баланс', 'trial-balance'], ['Санхүүгийн тайлан (Маягт А)', 'financial-statements']] },
    { label: 'Тохиргоо', items: [['Компани тохируулах', 'setup']] },
    { label: 'Прототип', items: [['Тайлбарын жагсаалт', 'notes'], ['Шалгалт (инвариант)', 'checks']] }
  ];
  app.nav = NAV;

  app.registerScreen = function (def) { app.screens[def.route] = def; if (app._booted && app.current === def.route) render(); };
  app.stub = function (o) {
    app.registerScreen({ route: o.route, title: o.title, crumbs: o.crumbs, intro: o.intro, owner: o.owner, soon: true,
      render: function (el) {
        el.innerHTML = '<div class="card"><div class="soon-card"><div class="big">Удахгүй</div><p>Энэ дэлгэцийг прототипийн дараагийн шатанд бүтээнэ.</p>' +
          (o.plan ? '<ul style="text-align:left;max-width:60ch">' + o.plan.map(function (p) { return '<li>' + ui.esc(p) + '</li>'; }).join('') + '</ul>' : '') +
          '<p class="small muted">Файл: <code>' + ui.esc(o.owner) + '</code></p></div></div>';
      } });
  };
  app.navigate = function (route, ctx) {
    if (ctx) Object.keys(ctx).forEach(function (k) { app.ctx[k] = ctx[k]; });
    if (location.hash === '#' + route) render(); else location.hash = '#' + route;
  };
  app.refresh = function () { render(); };

  function currentRoute() {
    var h = (location.hash || '').replace(/^#/, '');
    return /^[A-Za-z0-9._~-]+$/.test(h) ? h : 'home';
  }

  function buildNav() {
    var nav = document.getElementById('sidebar');
    var html = '<div class="has-note" data-note="shell.nav" style="display:block">';
    NAV.forEach(function (g, gi) {
      if (g.single) {
        html += '<ul class="nav-items nav-single" style="padding:0"><li><a href="#' + g.route + '" data-route="' + g.route + '">' + ui.esc(g.label) + '</a></li></ul>';
        return;
      }
      var collapsed = LS.get('ui:nav:' + gi, '0') === '1';
      html += '<div class="nav-group' + (collapsed ? ' collapsed' : '') + '" data-gi="' + gi + '"><button class="nav-head" type="button" aria-expanded="' + (!collapsed) + '" id="nav-head-' + gi + '"><span>' + ui.esc(g.label) + '</span><span class="chev" aria-hidden="true">▾</span></button><ul class="nav-items">';
      g.items.forEach(function (it) {
        var s = app.screens[it[1]];
        html += '<li><a href="#' + it[1] + '" data-route="' + it[1] + '"><span>' + ui.esc(it[0]) + '</span>' + (s && s.soon ? '<span class="soon">Удахгүй</span>' : '') + '</a></li>';
      });
      html += '</ul></div>';
    });
    html += '</div>';
    nav.innerHTML = html;
    ui.$$('.nav-head', nav).forEach(function (b) {
      b.addEventListener('click', function () {
        var g = b.parentElement; g.classList.toggle('collapsed');
        var c = g.classList.contains('collapsed'); b.setAttribute('aria-expanded', String(!c)); LS.set('ui:nav:' + g.getAttribute('data-gi'), c ? '1' : '0');
      });
    });
    nav.addEventListener('click', function (ev) { if (ev.target.closest('a')) document.getElementById('app').classList.remove('nav-open'); });
  }
  function markNav(route) {
    var alias = { 'sales-invoice': 'sales-invoices', 'posted-invoice': 'sales-invoices', customer: 'customers' }[route] || route;
    ui.$$('#sidebar a[data-route]').forEach(function (a) { if (a.getAttribute('data-route') === alias) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }

  function render() {
    var route = currentRoute();
    var prev = app.screens[app.current];
    if (prev && prev.onLeave && app.current !== route) { try { prev.onLeave(); } catch (e) { /* ignore */ } }
    app.current = route;
    var s = app.screens[route];
    var page = document.getElementById('page');
    if (!s) {
      page.innerHTML = '<div class="card"><div class="soon-card"><div class="big">Олдсонгүй</div><p>#' + ui.esc(route) + ' гэсэн дэлгэц алга.</p><a class="btn" href="#home">Нүүр рүү</a></div></div>';
      return;
    }
    var crumbs = [['Нүүр', 'home']].concat(s.crumbs || []);
    if (route === 'home') crumbs = [['Нүүр']];
    var introOpen = LS.get('ui:intro:' + route, '1') === '1';
    page.innerHTML =
      '<nav class="breadcrumb" aria-label="Замын мөр">' + crumbs.map(function (c, i) {
        var last = i === crumbs.length - 1;
        return (c[1] && !last ? '<a href="#' + c[1] + '">' + ui.esc(c[0]) + '</a>' : '<span>' + ui.esc(c[0]) + '</span>') + (last ? '' : '<span aria-hidden="true">›</span>');
      }).join('') + '</nav>' +
      (s.intro ? '<details class="intro" id="intro-' + route + '"' + (introOpen ? ' open' : '') + '><summary><span class="chev" aria-hidden="true">▸</span>Энэ дэлгэц<span class="muted" style="font-weight:400">— ' + ui.esc(s.title) + '</span></summary><div class="intro-body">' +
        (Array.isArray(s.intro) ? s.intro : [s.intro]).map(function (p) { return '<p>' + p + '</p>'; }).join('') + '</div></details>' : '') +
      '<div id="screen-body" class="stack"></div>';
    var intro = document.getElementById('intro-' + route);
    if (intro) intro.addEventListener('toggle', function () { LS.set('ui:intro:' + route, intro.open ? '1' : '0'); });
    try { s.render(document.getElementById('screen-body'), app.ctx); }
    catch (e) { document.getElementById('screen-body').innerHTML = ui.errList([{ code: 'ui.render_failed', message: String(e && e.message || e) }], 'Дэлгэц зурахад алдаа гарлаа'); if (window.console) console.error(e); }
    document.title = s.title + ' — ' + ERP.data.company.nameShort + ' — Бичил ERP прототип';
    markNav(route);
    app.decorateNotes();
    closePanelIfForeign();
  }

  // ---------------------------------------------------------------------------
  // Explanation mode: hotspots + panel
  // ---------------------------------------------------------------------------
  var VOID = { INPUT: 1, SELECT: 1, TEXTAREA: 1, IMG: 1, TR: 1, TABLE: 1, TBODY: 1, THEAD: 1, TFOOT: 1, BR: 1, HR: 1 };
  app.decorateNotes = function (root) {
    root = root || document.getElementById('app');
    ui.$$('.hotspot', root).forEach(function (b) { b.remove(); });
    var els = ui.$$('[data-note]', root).filter(function (el) { return !el.closest('[hidden]'); });
    var n = 0;
    app._noteOrder = [];
    els.forEach(function (el) {
      var id = el.getAttribute('data-note');
      var note = ERP.notes.get(id);
      if (!note) return;
      var host = VOID[el.tagName] ? el.parentElement : el;
      n += 1;
      host.classList.add('has-note');
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'hotspot'; b.textContent = String(n);
      b.setAttribute('data-note-ref', id);
      b.setAttribute('aria-label', 'Тайлбар ' + n + ': ' + note.title);
      b.title = note.title;
      host.appendChild(b);
      app._noteOrder.push({ id: id, n: n, el: el });
    });
  };
  function panel() { return document.getElementById('note-panel'); }
  app.openNote = function (id) {
    var note = ERP.notes.get(id);
    if (!note) return;
    var order = app._noteOrder || [];
    var idx = -1;
    order.forEach(function (o, i) { if (o.id === id && idx < 0) idx = i; });
    var num = idx >= 0 ? order[idx].n : '•';
    ui.$$('.note-focus').forEach(function (x) { x.classList.remove('note-focus'); });
    ui.$$('.hotspot.active').forEach(function (x) { x.classList.remove('active'); });
    if (idx >= 0) {
      order[idx].el.classList.add('note-focus');
      var hb = ui.$('.hotspot[data-note-ref="' + id + '"]'); if (hb) hb.classList.add('active');
    }
    var sec = function (t, body) { return body ? '<section class="np-sec"><h3>' + t + '</h3>' + body + '</section>' : ''; };
    var p = panel();
    p.innerHTML =
      '<div class="np-head"><div class="row" style="flex-wrap:nowrap;align-items:flex-start"><span class="np-num">' + num + '</span><h2 id="np-title">' + ui.esc(note.title) + '</h2></div>' +
      '<button class="btn ghost sm" id="np-close" aria-label="Тайлбарыг хаах">✕</button></div>' +
      '<div class="np-body">' +
      sec('Юу хийдэг вэ', '<p>' + note.what + '</p>') +
      sec('Яагаад', '<p>' + note.why + '</p>') +
      sec('BC-д', '<p>' + ui.esc(note.bc) + '</p>') +
      sec('Дүрэм', note.rules.length ? '<div class="chips">' + note.rules.map(function (r) { return '<span class="chip rule">' + ui.esc(r) + '</span>'; }).join('') + '</div>' : '') +
      sec('Өгөгдөл', note.data.length ? '<div class="chips">' + note.data.map(function (r) { return '<span class="chip">' + ui.esc(r) + '</span>'; }).join('') + '</div>' : '') +
      sec('Баримт', note.doc.length ? '<ul>' + note.doc.map(function (d) { return '<li><a href="' + ui.esc(ERP.notes.link(d)) + '" target="_blank" rel="noopener">' + ui.esc(d.file) + (d.section ? ' § ' + ui.esc(d.section.replace(/`/g, '')) : '') + '</a></li>'; }).join('') + '</ul>' : '') +
      '</div>' +
      '<div class="np-nav"><button class="btn sm" id="np-prev"' + (idx <= 0 ? ' disabled' : '') + '>‹ Өмнөх</button><span class="small muted">' + (idx >= 0 ? (idx + 1) + ' / ' + order.length : 'жагсаалтаас') + '</span><button class="btn sm" id="np-next"' + (idx < 0 || idx >= order.length - 1 ? ' disabled' : '') + '>Дараах ›</button></div>';
    p.hidden = false;
    p.setAttribute('data-note-id', id);
    p.setAttribute('data-route', app.current);
    p.scrollTop = 0;
    ui.$('#np-close').addEventListener('click', app.closeNote);
    ui.$('#np-prev').addEventListener('click', function () { if (idx > 0) app.openNote(order[idx - 1].id); });
    ui.$('#np-next').addEventListener('click', function () { if (idx >= 0 && idx < order.length - 1) app.openNote(order[idx + 1].id); });
    ui.$('#np-close').focus();
  };
  app.closeNote = function () {
    panel().hidden = true;
    ui.$$('.note-focus').forEach(function (x) { x.classList.remove('note-focus'); });
    ui.$$('.hotspot.active').forEach(function (x) { x.classList.remove('active'); });
  };
  function closePanelIfForeign() { var p = panel(); if (!p.hidden && p.getAttribute('data-route') !== app.current) app.closeNote(); }
  function setNotes(on) {
    app.state.notesOn = on;
    document.body.classList.toggle('notes-on', on);
    var b = document.getElementById('btn-notes');
    b.setAttribute('aria-pressed', String(on));
    LS.set('ui:notes', on ? '1' : '0');
    if (!on) app.closeNote();
  }

  // ---------------------------------------------------------------------------
  // Theme (light / dark / system)
  // ---------------------------------------------------------------------------
  var THEMES = ['system', 'light', 'dark'];
  var THEME_LABEL = { system: 'Систем', light: 'Цайвар', dark: 'Бараан' };
  function applyTheme(t) {
    app.state.theme = t;
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    var b = document.getElementById('btn-theme');
    if (b) { b.querySelector('.tb-label').textContent = 'Өнгө: ' + THEME_LABEL[t]; b.setAttribute('aria-label', 'Өнгөний горим: ' + THEME_LABEL[t] + ' (дарж солих)'); }
    LS.set('ui:theme', t);
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  function boot() {
    E = ERP.engine;
    try { E.boot(); }
    catch (e) {
      document.getElementById('page').innerHTML = ui.errList([{ code: 'engine.boot_failed', message: String(e.message || e) }], 'Хөдөлгүүр эхлэхэд алдаа гарлаа');
      throw e;
    }
    var co = ERP.data.company;
    ui.$('#co-name').textContent = co.name;
    ui.$('#co-tin').textContent = 'ТТД ' + co.tin;
    ui.$('#workdate').textContent = 'Ажлын огноо ' + E.dates.fmt(ERP.data.meta.workDate);
    applyTheme(THEMES.indexOf(LS.get('ui:theme', 'system')) >= 0 ? LS.get('ui:theme', 'system') : 'system');
    ui.$('#btn-theme').addEventListener('click', function () { applyTheme(THEMES[(THEMES.indexOf(app.state.theme) + 1) % 3]); });
    setNotes(LS.get('ui:notes', '1') === '1');
    ui.$('#btn-notes').addEventListener('click', function () { setNotes(!app.state.notesOn); });
    var role = LS.get('ui:role', 'OWNER');
    app.state.role = role === 'ACCOUNTANT' ? 'ACCOUNTANT' : 'OWNER';
    var rs = ui.$('#role-select');
    rs.value = app.state.role;
    rs.addEventListener('change', function () { app.state.role = rs.value; LS.set('ui:role', rs.value); if (app.current === 'home') render(); });
    ui.$('#btn-menu').addEventListener('click', function () {
      var a = document.getElementById('app'); a.classList.toggle('nav-open');
      ui.$('#btn-menu').setAttribute('aria-expanded', String(a.classList.contains('nav-open')));
    });
    // notes: hotspot click, or click on an annotated element (not on its controls) in explanation mode
    document.getElementById('app').addEventListener('click', function (ev) {
      var hs = ev.target.closest('.hotspot');
      if (hs) { ev.preventDefault(); ev.stopPropagation(); app.openNote(hs.getAttribute('data-note-ref')); return; }
      if (!app.state.notesOn) return;
      if (ev.target.closest('button, a, input, select, textarea, summary, label, .note-panel')) return;
      var el = ev.target.closest('[data-note]');
      if (el) app.openNote(el.getAttribute('data-note'));
    }, true);
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !panel().hidden && !document.querySelector('.overlay')) app.closeNote(); });
    buildNav();
    window.addEventListener('hashchange', render);
    app._booted = true;
    render();
  }
  app.boot = boot;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 0);
})();

</script>
<script>/* ===== js/screens/home.js ===== */
/* =============================================================================
   js/screens/home.js — #home: role center (15 §3, S-PLT-05). Owner / Accountant variants.
   Every figure comes from ERP.engine (cues are computed from the posted ledgers).
   ========================================================================== */
(function () {
  'use strict';
  var ERP = window.ERP, ui = ERP.ui;

  var CUE_META = {
    'CUE-01': { title: 'Төлөгдөөгүй нэхэмжлэх', link: '#sales-invoices' },
    'CUE-02': { title: 'Хугацаа хэтэрсэн авлага', link: '#customers', note: 'home.cue-overdue' },
    'CUE-03': { title: 'Мөнгөн хөрөнгө', link: '#cash', note: 'home.cue-cash' },
    'CUE-04': { title: 'Төлөх НӨАТ (урьдчилсан)', link: '#vat-return', note: 'home.cue-vat' },
    'CUE-05': { title: 'eBarimt хүлээгдэж буй', link: '#ebarimt', note: 'home.cue-ebarimt-pending' },
    'CUE-06': { title: 'eBarimt алдаа, тодорхойгүй', link: '#ebarimt', note: 'home.cue-ebarimt-errors' },
    'CUE-07': { title: 'eBarimt-гүй борлуулалт', link: '#sales-invoices' },
    'CUE-08': { title: 'Сугалааны үлдэгдэл (PosAPI)', link: '#ebarimt', note: 'home.cue-lottery' },
    'CUE-09': { title: 'Ноорог баримт', link: '#sales-invoices' },
    'CUE-10': { title: 'Тулгагдаагүй хуулгын мөр', link: '#bank-rec' },
    'CUE-11': { title: 'Энэ сарын борлуулалт', link: '#sales-invoices' },
    'CUE-12': { title: '7 хоногт төлөх өглөг', link: '#purchase-invoices' },
    'CUE-13': { title: 'Хугацаа хэтэрсэн өглөг', link: '#purchase-invoices' },
    'CUE-14': { title: 'Баталгаажаагүй орцын НӨАТ', link: '#purchase-invoices', note: 'home.cue-input-vat' },
    'CUE-15': { title: 'Үеийн төлөв', link: '#periods' },
    'CUE-16': { title: 'Нийт авлага', link: '#customers', note: 'home.cue-ar' },
    'CUE-17': { title: 'Нийт өглөг', link: '#purchase-invoices' }
  };
  // 15 §3.3.1 HomeLayout
  var LAYOUT = {
    OWNER: [['Мөнгө ба тооцоо', ['CUE-03', 'CUE-01', 'CUE-02', 'CUE-17', 'CUE-16', 'CUE-11']],
      ['Татвар ба eBarimt', ['CUE-04', 'CUE-06', 'CUE-05', 'CUE-08', 'CUE-07']]],
    ACCOUNTANT: [['Хийх ажил', ['CUE-09', 'CUE-10', 'CUE-06', 'CUE-07', 'CUE-12', 'CUE-14', 'CUE-05', 'CUE-08']],
      ['Татвар ба хаалт', ['CUE-04', 'CUE-15', 'CUE-02', 'CUE-13', 'CUE-01', 'CUE-03']]]
  };
  var STATE_TEXT = { FAVORABLE: '✓ Хэвийн', AMBIGUOUS: '◐ Анхаарах', UNFAVORABLE: '⚠ Арга хэмжээ', NONE: '' };

  function cueTile(id, c, E) {
    var m = CUE_META[id];
    var M = E.money, D = E.dates;
    var value = '', sub = '', title = m.title, full = '';
    switch (id) {
      case 'CUE-03':
        value = M.compact(c.value); full = M.fmt(c.value, { sym: true });
        sub = 'Касс ' + M.compact(c.breakdown.CASH) + ' · Банк ' + M.compact(c.breakdown.BANK); break;
      case 'CUE-01': value = M.compact(c.value); full = M.fmt(c.value, { sym: true }); sub = c.count + ' нэхэмжлэх'; break;
      case 'CUE-02': value = M.compact(c.value); full = M.fmt(c.value, { sym: true }); sub = c.count + ' харилцагч · ' + c.entries + ' баримт'; break;
      case 'CUE-04':
        if (c.value < 0) title = 'Буцаан авах НӨАТ (урьдчилсан)';
        value = M.compact(c.value); full = M.fmt(c.value, { sym: true });
        sub = E.dates.monthLabel(c.period).replace(/ \d{4}$/, '') + ' · ' + (c.days >= 0 ? 'илгээх хүртэл ' + c.days + ' хоног' : 'хугацаа ' + (-c.days) + ' хоног хэтэрсэн'); break;
      case 'CUE-05': value = String(c.value); sub = c.oldest ? 'хамгийн хуучин: ' + D.fmt(c.oldest.slice(0, 10)) + ' ' + c.oldest.slice(11, 16) : 'дараалал хоосон'; break;
      case 'CUE-06': value = String(c.value); sub = c.unknown ? c.unknown + ' тодорхойгүй (UNKNOWN)' : 'тодорхойгүй баримтгүй'; break;
      case 'CUE-07': if (!c.value) return ''; value = String(c.value); break;      // UX-HOME-02: hidden at 0
      case 'CUE-08': value = c.value.toLocaleString('en-US').replace(/,/g, ' '); sub = 'сүүлийн sendData: ' + c.lastSendData.slice(5).replace('-', '.'); break;
      case 'CUE-09': value = String(c.value); sub = 'борлуулалтын ноорог'; break;
      case 'CUE-10': value = c.value + ' мөр'; sub = 'Хаан, Голомт · 9-р сар'; break;
      case 'CUE-11': value = M.compact(c.value); full = M.fmt(c.value, { sym: true }); sub = E.dates.monthLabel(c.month) + ' · НӨАТ-гүй'; break;
      case 'CUE-12': value = M.compact(c.value); sub = c.count + ' нэхэмжлэх'; break;
      case 'CUE-13': value = M.compact(c.value); sub = c.count + ' нэхэмжлэх'; break;
      case 'CUE-14': value = c.count + ' · ' + M.compact(c.value); sub = 'ДДТД бүртгээгүй / баталгаажаагүй'; break;
      case 'CUE-15': value = E.dates.monthLabel(c.period).replace(/ \d{4}$/, '') + ': ' + ui.pillLabel(c.value); sub = 'Хаасан: ' + (c.lastClosed ? E.dates.monthLabel(c.lastClosed) : '—') + (c.prevOpen ? ' · ' + E.dates.monthLabel(c.prevOpen).replace(/ \d{4}$/, '') + ' нээлттэй' : ''); break;
      case 'CUE-16': value = M.compact(c.value); full = M.fmt(c.value, { sym: true }); sub = 'харилцагчдын үлдэгдэл'; break;
      case 'CUE-17': value = M.compact(c.value); full = M.fmt(c.value, { sym: true }); sub = '7 хоногт: ' + M.compact(c.due7); break;
    }
    var st = c.state || 'NONE';
    var aria = title + ': ' + (full || value) + (sub ? ', ' + sub : '') + (STATE_TEXT[st] ? ', ' + STATE_TEXT[st].slice(2) : '');
    return '<a class="cue" href="' + m.link + '" data-state="' + st + '" aria-label="' + ui.esc(aria) + '" title="' + ui.esc(full || value) + '"' + (m.note ? ' data-note="' + m.note + '"' : '') + '>' +
      '<span class="cue-title">' + ui.esc(title) + '</span><span class="cue-value">' + ui.esc(value) + '</span>' +
      (sub ? '<span class="cue-sub">' + ui.esc(sub) + '</span>' : '') + (STATE_TEXT[st] ? '<span class="cue-state">' + STATE_TEXT[st] + '</span>' : '') + '</a>';
  }

  function headline(role, cues, E) {                   // 15 §3.5
    var name = role === 'OWNER' ? 'Наранбаатар' : 'Сарнай';
    var tip = '';
    var c6 = cues['CUE-06'], c4 = cues['CUE-04'], c2 = cues['CUE-02'];
    if (c6.unknown > 0) tip = '<a href="#ebarimt">eBarimt: ' + c6.unknown + ' баримт тодорхойгүй — шийдвэрлэх ›</a>';
    else if (c4 && c4.days <= 3) tip = '<a href="#vat-return">НӨАТ-ын тайлан (' + E.dates.monthLabel(c4.period).replace(/ \d{4}$/, '') + ') илгээх хүртэл ' + c4.days + ' хоног ›</a>';
    else if (c2.value > 0) tip = '<a href="#customers">Хугацаа хэтэрсэн авлага ' + E.money.compact(c2.value) + ' ›</a>';
    return 'Өглөөний мэнд, ' + name + '. ' + tip;
  }

  function chart(E) {                                  // monthly sales (invoices − credit memos, excl. VAT), drawn to scale
    var months = E.reports.salesByMonth(2026).slice(0, 10);
    var max = Math.max.apply(null, months.map(function (m) { return m.amount; }));
    var stepM = [1, 2, 2.5, 5, 10].map(function (x) { return x * 1e8; });       // cents: 1, 2, 2.5, 5, 10 сая
    var step = stepM.filter(function (s) { return max / s <= 5; })[0] || 1e9;
    var top = Math.ceil(max / step) * step;
    var W = 640, H = 230, L = 52, R = 12, T = 14, B = 34;
    var pw = W - L - R, ph = H - T - B, bw = pw / months.length;
    var y = function (v) { return T + ph - (v / top) * ph; };
    var grid = '', ticks = '';
    for (var v = 0; v <= top; v += step) {
      grid += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '" class="ch-grid"/>';
      ticks += '<text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" class="ch-tick" text-anchor="end">' + (v / 1e8).toString() + '</text>';
    }
    var last = months.reduce(function (i, m, k) { return m.amount > 0 ? k : i; }, 0);
    var bars = months.map(function (m, i) {
      var x = L + i * bw + bw * 0.22, w = bw * 0.56, h = Math.max(0, (m.amount / top) * ph);
      var y0 = T + ph;
      var r = Math.min(4, w / 2, h);
      var path = h > 0 ? 'M' + x.toFixed(1) + ',' + y0 + ' V' + (y0 - h + r).toFixed(1) + ' Q' + x.toFixed(1) + ',' + (y0 - h).toFixed(1) + ' ' + (x + r).toFixed(1) + ',' + (y0 - h).toFixed(1) +
        ' H' + (x + w - r).toFixed(1) + ' Q' + (x + w).toFixed(1) + ',' + (y0 - h).toFixed(1) + ' ' + (x + w).toFixed(1) + ',' + (y0 - h + r).toFixed(1) + ' V' + y0 + ' Z' : '';
      var lbl = E.dates.monthLabel(m.month).replace(/ \d{4}$/, '');
      return '<g class="ch-bar" tabindex="0" data-i="' + i + '" aria-label="' + ui.esc(lbl + ': ' + E.money.fmt(m.amount, { sym: true }) + ', ' + m.count + ' нэхэмжлэх') + '">' +
        '<rect x="' + (L + i * bw).toFixed(1) + '" y="' + T + '" width="' + bw.toFixed(1) + '" height="' + ph + '" class="ch-hit"/>' +
        (path ? '<path d="' + path + '" class="ch-mark' + (i === last ? ' ch-last' : '') + '"/>' : '') +
        '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 14) + '" class="ch-tick" text-anchor="middle">' + (i + 1) + '</text>' +
        (i === last || m.amount === max ? '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (y(m.amount) - 5).toFixed(1) + '" class="ch-label" text-anchor="middle">' + (m.amount / 1e8).toFixed(1) + '</text>' : '') +
        '</g>';
    }).join('');
    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart-svg" role="img" aria-label="2026 оны сарын борлуулалт, сая төгрөгөөр">' + grid + ticks +
      '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" class="ch-axis"/>' + bars +
      '<text x="' + (W - R) + '" y="' + (H - 1) + '" class="ch-tick" text-anchor="end">сар (2026)</text><text x="4" y="' + (T + 4) + '" class="ch-tick">сая ₮</text></svg>';
    var table = '<div class="table-wrap"><table class="grid-table"><thead><tr><th>Сар</th><th class="num">Борлуулалт (НӨАТ-гүй)</th><th class="num">Нэхэмжлэх</th></tr></thead><tbody>' +
      months.map(function (m) { return '<tr><td>' + ui.esc(E.dates.monthLabel(m.month)) + '</td>' + ui.moneyCell(m.amount) + '<td class="num">' + m.count + '</td></tr>'; }).join('') + '</tbody></table></div>';
    return { svg: svg, table: table, months: months };
  }

  function render(el) {
    var E = ERP.engine, role = ERP.app.state.role;
    var cues = E.home.cues();
    var html = '';
    html += '<div class="page-head"><div class="title-wrap"><h1>Нүүр</h1><span class="pill neutral">' + (role === 'OWNER' ? 'Эзэн' : 'Нягтлан') + '</span></div>' +
      '<span class="small muted">' + E.dates.fmt(ERP.data.meta.today) + ' 09:00-ийн байдлаар</span></div>';
    html += '<div class="headline" data-note="home.headline">' + headline(role, cues, E) + '</div>';
    html += '<div class="row quick-actions" data-note="home.actions">' +
      '<button class="btn primary" id="qa-new-invoice" type="button">+ Шинэ нэхэмжлэх</button>' +
      (role === 'OWNER' ? '<a class="btn" href="#cash">+ Кассын орлого</a><a class="btn" href="#purchase-invoices">Худалдан авалт</a>'
        : '<a class="btn" href="#journal">+ Ерөнхий журнал</a><a class="btn" href="#bank-rec">Хуулга импорт</a><a class="btn" href="#vat-return">НӨАТ-ын тайлан</a><a class="btn" href="#trial-balance">Гүйлгээ баланс</a>') + '</div>';
    LAYOUT[role].forEach(function (g) {
      html += '<section class="cue-group"><h2>' + ui.esc(g[0]) + '</h2><div class="cues">' + g[1].map(function (id) { return cues[id] ? cueTile(id, cues[id], E) : ''; }).join('') + '</div></section>';
    });
    // VAT cue calculation
    var c4 = cues['CUE-04'];
    if (c4) {
      var es = E.vat.entries().filter(function (e) { return e.vatDate.slice(0, 7) === c4.period && e.type !== 'SETTLEMENT'; });
      var sale = es.filter(function (e) { return e.type === 'SALE'; });
      var conf = es.filter(function (e) { return e.type === 'PURCHASE' && e.deductibleConfirmed; });
      var unc = es.filter(function (e) { return e.type === 'PURCHASE' && !e.deductibleConfirmed && e.amount !== 0; });
      var sum = function (a) { return a.reduce(function (s, e) { return s + e.amount; }, 0); };
      html += ui.calc('Тооцоог харах: Төлөх НӨАТ (' + E.dates.monthLabel(c4.period) + ')',
        '<div class="formula">CUE-04 = −(Σ SALE.amount + Σ PURCHASE.amount [deductible_confirmed]),  vat_date ∈ ' + c4.period + '\n' +
        '      = −(' + E.money.fmt(sum(sale)) + ' + ' + E.money.fmt(sum(conf)) + ')\n' +
        '      = ' + E.money.fmt(c4.value, { sym: true }) + '\n' +
        'Илгээх хугацаа: ' + E.dates.fmt(c4.due) + ' (vat.return_due_day = 10) → ' + c4.days + ' хоног → ' + (c4.state === 'UNFAVORABLE' ? 'Арга хэмжээ (≤ 3)' : c4.state) + '</div>' +
        '<p>Борлуулалтын ' + sale.length + ' VAT entry (тэмдэг сөрөг, BR-TAX-29), баталгаажсан орцын ' + conf.length + ' entry. Баталгаажаагүй ' + unc.length + ' entry (' + E.money.fmt(sum(unc), { sym: true }) + ') тооцоонд ороогүй — D-E4.</p>');
    }
    // chart + overdue top 5
    var ch = chart(E);
    var ag = E.reports.aging('customer');
    var od = ag.parties.map(function (p) {
      var o = p.entries.filter(function (x) { return x.days > 0 && x.remaining > 0; });
      return { name: p.name, no: p.party, amount: o.reduce(function (s, x) { return s + x.remaining; }, 0), days: o.reduce(function (m, x) { return Math.max(m, x.days); }, 0) };
    }).filter(function (x) { return x.amount > 0; }).sort(function (a, b) { return b.amount - a.amount; }).slice(0, 5);
    html += '<div class="grid home-split">' +
      '<div class="card" data-note="home.chart"><div class="card-head"><h2>Сарын борлуулалт, 2026 (НӨАТ-гүй)</h2><button class="btn ghost sm" id="chart-toggle" type="button" aria-pressed="false">Хүснэгтээр харах</button></div>' +
      '<div class="card-body chart-body"><div id="chart-view">' + ch.svg + '<div class="ch-tip" id="ch-tip" hidden></div></div><div id="chart-table" hidden>' + ch.table + '</div>' +
      '<p class="xs muted">Нэхэмжлэх − кредит нот, НӨАТ-гүй дүн (CUE-11-ийн суурь). Тэмдэглэсэн утга: хамгийн их ба сүүлийн сар.</p></div></div>' +
      '<div class="card" data-note="home.overdue"><div class="card-head"><h2>Хугацаа хэтэрсэн — топ 5</h2><a class="small" href="#customers">Насжилт ›</a></div>' +
      '<div class="card-body flush"><div class="table-wrap"><table class="grid-table"><thead><tr><th>Харилцагч</th><th class="num">Дүн</th><th class="num">Хоног</th></tr></thead><tbody>' +
      (od.length ? od.map(function (x) { return '<tr><td>' + ui.esc(x.name) + '</td>' + ui.moneyCell(x.amount) + '<td class="num">' + x.days + '</td></tr>'; }).join('') : '<tr><td colspan="3" class="empty">Хугацаа хэтэрсэн авлага алга</td></tr>') +
      '</tbody></table></div></div></div></div>';
    if (role === 'ACCOUNTANT') {
      var cl = E.home.closeChecklist('2026-09');
      html += '<div class="card" data-note="home.checklist"><div class="card-head"><h2>9-р сарын хаалт (' + cl.ok + '/' + cl.items.length + ')</h2><a class="small" href="#periods">Үе ба хаалт ›</a></div><div class="card-body flush">' +
        cl.items.map(function (i) {
          var mark = i.status === 'OK' ? '<span class="check-mark pass" aria-hidden="true">✓</span>' : i.status === 'BLOCKING' ? '<span class="check-mark fail" aria-hidden="true">✕</span>' : '<span class="check-mark warn" aria-hidden="true">☐</span>';
          return '<div class="check-row">' + mark + '<div><a href="' + i.link + '">' + ui.esc(i.label) + '</a><div class="xs muted">' + ui.esc(i.detail) + ' · <code>' + i.code + '</code> ' + i.rule + '</div></div>' + ui.pill(i.status) + '</div>';
        }).join('') + '</div></div>';
    } else {
      var cash = cues['CUE-03'];
      html += ui.calc('Тооцоог харах: Мөнгөн хөрөнгө (CUE-03)',
        '<div class="formula">' + ERP.data.bankAccounts.map(function (b) { return b.name.padEnd(30, ' ') + E.money.fmt(E.reports.bankBalance(b.no, ERP.data.meta.today)).padStart(18, ' ') + '   (' + E.setup.bankGlAccount(b.no) + ')'; }).join('\n') +
        '\n' + 'Σ'.padEnd(30, ' ') + E.money.fmt(cash.value).padStart(18, ' ') + '</div><p>Банкны дэд дэвтрийн (bank_ledger_entry) үлдэгдэл. #checks хуудас үүнийг 1100/1110/1111 дансны G/L үлдэгдэлтэй тулгана (BR-PST-42).</p>');
    }
    el.innerHTML = html;

    ui.$('#qa-new-invoice').addEventListener('click', function () {
      var d = E.drafts.create(null);
      ERP.app.navigate('sales-invoice', { draftNo: d.no });
    });
    var tg = ui.$('#chart-toggle');
    tg.addEventListener('click', function () {
      var t = ui.$('#chart-table'), v = ui.$('#chart-view');
      var showTable = t.hidden;
      t.hidden = !showTable; v.hidden = showTable;
      tg.textContent = showTable ? 'Графикаар харах' : 'Хүснэгтээр харах';
      tg.setAttribute('aria-pressed', String(showTable));
    });
    var tip = ui.$('#ch-tip'), view = ui.$('#chart-view');
    var show = function (g) {
      var i = +g.getAttribute('data-i'), m = ch.months[i];
      tip.innerHTML = '<strong>' + ui.esc(E.dates.monthLabel(m.month)) + '</strong><br>' + ui.esc(E.money.fmt(m.amount, { sym: true })) + '<br><span class="muted">' + m.count + ' нэхэмжлэх</span>';
      tip.hidden = false;
      var r = g.querySelector('.ch-hit').getBoundingClientRect(), vr = view.getBoundingClientRect();
      var left = r.left - vr.left + r.width / 2;
      tip.style.left = Math.min(Math.max(left, 70), vr.width - 70) + 'px';
      ui.$$('.ch-bar').forEach(function (b) { b.classList.toggle('dim', b !== g); });
    };
    var hide = function () { tip.hidden = true; ui.$$('.ch-bar').forEach(function (b) { b.classList.remove('dim'); }); };
    ui.$$('.ch-bar').forEach(function (g) {
      g.addEventListener('mouseenter', function () { show(g); });
      g.addEventListener('focus', function () { show(g); });
      g.addEventListener('mouseleave', hide);
      g.addEventListener('blur', hide);
    });
  }

  ERP.app.registerScreen({
    route: 'home', title: 'Нүүр', owner: 'js/screens/home.js',
    intro: ['Компанийн өнөөдрийн байдал: мөнгө хаана байна, хэн хэдэн төгрөг өртэй, татвар ба eBarimt-д эрсдэл байгаа эсэх. Тоо бүр батлагдсан бичилтээс (ledger) тооцогдоно; дарж холбогдох жагсаалт руу орно.',
      'Эзэн ба Нягтлан өөр хувилбар хардаг (дээд мөрөнд үүргээ солиод үзээрэй). Нүүр хуудас юу ч батлахгүй — зөвхөн уншина.'],
    render: render
  });
})();

</script>
<script>/* ===== js/screens/sales.js ===== */
/* =============================================================================
   js/screens/sales.js — #sales-invoices (S-SAL-01/05), #sales-invoice (S-SAL-02 draft editor),
   #posted-invoice (S-SAL-06 + eBarimt panel, S-EBR-04 print preview).
   Accounting is done by ERP.engine (calcDocument / sales.preview / sales.post); this file only renders.
   ========================================================================== */
(function () {
  'use strict';
  var ERP = window.ERP, ui = ERP.ui, app = ERP.app;
  var E = function () { return ERP.engine; };
  var printPayload = null;     // D-J3 / UX-SEC-01: qrData + lottery live ONLY in this closure variable, never in state/storage
  var keyHandler = null;

  // ---------------------------------------------------------------------------
  // helpers
  // ---------------------------------------------------------------------------
  function customer(no) { return E().setup.customer(no); }
  function fmtM(c, o) { return E().money.fmt(c, o); }
  function ebLabel(type) { return { B2B_RECEIPT: 'B2B (ТТД-тэй ААН)', B2C_RECEIPT: 'B2C (иргэн)', NONE: 'Үгүй' }[type] || type; }
  function directAccounts() { return E().setup.accounts().filter(function (a) { return a.type === 'POSTING' && a.direct && a.incomeBalance === 'INCOME_STATEMENT'; }); }
  function chainBadge(p) { return E().ebarimt.chainStatus(p); }
  function fmtTs(ts) { return ts ? ui.date(ts.slice(0, 10)) + ts.slice(10) : ''; }
  function opt(v, label, sel) { return '<option value="' + ui.esc(v) + '"' + (sel ? ' selected' : '') + '>' + ui.esc(label) + '</option>'; }

  // ===========================================================================
  // #sales-invoices — list
  // ===========================================================================
  function renderList(el, ctx) {
    var tab = ctx.salesTab || 'drafts';
    var drafts = E().drafts.list(), inv = E().sales.postedInvoices(), cms = E().sales.postedCreditMemos();
    var q = (ctx.salesSearch || '').toLowerCase();
    var match = function (s) { return !q || s.toLowerCase().indexOf(q) >= 0; };
    var html = '<div class="page-head"><div class="title-wrap"><h1>Борлуулалтын нэхэмжлэх</h1></div>' +
      '<div class="row"><button class="btn primary" id="sl-new" type="button">+ Шинэ нэхэмжлэх</button></div></div>';
    html += '<div class="row between"><div class="tabs" role="tablist" data-note="sales.list-tabs">' +
      [['drafts', 'Ноорог', drafts.length], ['posted', 'Батлагдсан нэхэмжлэх', inv.length], ['cm', 'Кредит нот', cms.length]].map(function (t) {
        return '<button class="tab" role="tab" type="button" id="tab-' + t[0] + '" aria-selected="' + (tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + ' <span class="count">' + t[2] + '</span></button>';
      }).join('') + '</div>' +
      '<div class="row"><label class="sr-only" for="sl-search">Хайх</label><input class="input" id="sl-search" type="search" placeholder="Дугаар эсвэл харилцагч…" value="' + ui.esc(ctx.salesSearch || '') + '" style="width:220px"></div></div>';
    if (tab === 'drafts') {
      html += '<div class="card"><div class="table-wrap"><table class="grid-table"><thead><tr><th>Ноорог №</th><th>Харилцагч</th><th>Баримтын огноо</th><th>Бүртгэлийн огноо</th><th class="num">Нийт дүн ≈</th><th>Төлөв</th></tr></thead><tbody>' +
        (drafts.filter(function (d) { return match(d.no + ' ' + (d.customerName || '')); }).map(function (d) {
          var c = E().drafts.calc(d);
          return '<tr class="clickable" data-draft="' + d.no + '" tabindex="0"><td class="code">' + d.no + '</td><td>' + ui.esc(d.customerName || '— харилцагчгүй —') + '</td><td>' + ui.date(d.documentDate) + '</td><td>' + ui.date(d.postingDate) + '</td>' + ui.moneyCell(c.amountInclVat) + '<td>' + ui.pill('DRAFT') + '</td></tr>';
        }).join('') || '<tr><td colspan="6" class="empty">Ноорог алга. "+ Шинэ нэхэмжлэх" дарж эхлүүлнэ үү.</td></tr>') + '</tbody></table></div></div>' +
        '<p class="xs muted">Ноорогийн дугаар (DSI-…) завсартай байж болно; хуулийн дугаар SI-2026-##### зөвхөн батлахад олгогдоно (D-C7).</p>';
    } else if (tab === 'posted') {
      html += '<div class="card" data-note="sales.posted-list"><div class="table-wrap"><table class="grid-table"><thead><tr><th>Дугаар</th><th>Огноо</th><th>Харилцагч</th><th class="num">Нийт дүн</th><th class="num">Үлдэгдэл</th><th>Төлбөр</th><th>eBarimt</th><th>Төлөх огноо</th></tr></thead><tbody>' +
        inv.slice().reverse().filter(function (p) { return match(p.no + ' ' + p.customerName); }).map(function (p) {
          var ps = E().sales.paymentStatus(p);
          return '<tr class="clickable" data-posted="' + p.no + '" tabindex="0"><td class="code">' + p.no + '</td><td>' + ui.date(p.postingDate) + '</td><td>' + ui.esc(p.customerName) + '</td>' + ui.moneyCell(p.amountInclVat) + ui.moneyCell(ps.remaining, { blankZero: true }) +
            '<td>' + ui.pill(ps.badge) + '</td><td>' + ui.pill(chainBadge(p)) + '</td><td>' + ui.date(p.dueDate) + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
    } else {
      html += '<div class="card"><div class="table-wrap"><table class="grid-table"><thead><tr><th>Дугаар</th><th>Огноо</th><th>Харилцагч</th><th>Эх нэхэмжлэх</th><th>Шалтгаан</th><th class="num">Нийт дүн</th><th>eBarimt</th></tr></thead><tbody>' +
        cms.slice().reverse().filter(function (p) { return match(p.no + ' ' + p.customerName); }).map(function (p) {
          return '<tr class="clickable" data-posted="' + p.no + '" tabindex="0"><td class="code">' + p.no + '</td><td>' + ui.date(p.postingDate) + '</td><td>' + ui.esc(p.customerName) + '</td><td class="code">' + ui.esc(p.appliesTo || '') + '</td><td>' + ui.esc(ERP.data.reasonCodes[p.reason] || p.reason || '') + '</td>' + ui.moneyCell(p.amountInclVat) + '<td>' + ui.pill(chainBadge(p)) + '</td></tr>';
        }).join('') + '</tbody></table></div></div><p class="xs muted">Кредит нот үүсгэх, нэхэмжлэх цуцлах дэлгэцийг дараагийн шатанд (js/screens/sales-ar.js) бүтээнэ.</p>';
    }
    el.innerHTML = html;
    ui.$$('.tab', el).forEach(function (b) { b.addEventListener('click', function () { ctx.salesTab = b.getAttribute('data-tab'); renderList(el, ctx); app.decorateNotes(); ui.$('#tab-' + ctx.salesTab).focus(); }); });
    var s = ui.$('#sl-search');
    s.addEventListener('input', function () { ctx.salesSearch = s.value; var pos = s.selectionStart; renderList(el, ctx); app.decorateNotes(); var n = ui.$('#sl-search'); n.focus(); n.setSelectionRange(pos, pos); });
    ui.$('#sl-new').addEventListener('click', function () { var d = E().drafts.create(null); app.navigate('sales-invoice', { draftNo: d.no }); });
    ui.$$('tr[data-draft]', el).forEach(function (tr) {
      var go = function () { app.navigate('sales-invoice', { draftNo: tr.getAttribute('data-draft') }); };
      tr.addEventListener('click', go); tr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    });
    ui.$$('tr[data-posted]', el).forEach(function (tr) {
      var go = function () { app.navigate('posted-invoice', { postedNo: tr.getAttribute('data-posted') }); };
      tr.addEventListener('click', go); tr.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
    });
  }

  // ===========================================================================
  // #sales-invoice — draft editor
  // ===========================================================================
  function currentDraft(ctx) {
    var d = ctx.draftNo ? E().drafts.get(ctx.draftNo) : null;
    if (!d) d = E().drafts.list()[0] || null;
    if (!d) d = E().drafts.create(null);
    ctx.draftNo = d.no;
    return d;
  }

  function calcBody(d, c) {                            // "Тооцоог харах" — step by step with the real numbers
    var M = E().money;
    var rows = c.lines.filter(function (l) { return !l.blank; }).map(function (l) {
      var exact = M.fmtScaled(l.qty * l.price, 11, 2, 11);
      var ldaExact = l.disc ? M.fmtScaled(BigInt(l.G) * l.disc, 9, 2, 9) : '0';
      return '<tr><td>' + (l.idx + 1) + '</td><td class="code">' + ui.esc(l.no) + '</td><td class="num">' + M.fmtQty(l.qty) + ' × ' + M.fmtPrice(l.price) + ' = ' + exact + '</td><td class="num">' + fmtM(l.G) + '</td>' +
        '<td class="num">' + (l.disc ? ldaExact + ' → ' + fmtM(l.LDA) : '0.00') + '</td><td class="num">' + fmtM(l.LA) + '</td></tr>';
    }).join('');
    var html = '<p><strong>1. Мөрийн дүн</strong> (06 §6.2, BR-SAL-18): G = r(Тоо × Нэгжийн үнэ); хөнгөлөлт LDA = r(G × LD% / 100); мөрийн дүн LA = G − LDA. r = 0.01 хүртэл, тэгээс холдуулж бөөрөнхийлнө (ADR-0006).</p>' +
      '<div class="table-wrap"><table class="grid-table"><thead><tr><th>Мөр</th><th>Дугаар</th><th class="num">Тоо × Үнэ (яг)</th><th class="num">G</th><th class="num">LDA</th><th class="num">LA</th></tr></thead><tbody>' + (rows || '<tr><td colspan="6" class="empty">Мөр алга</td></tr>') + '</tbody></table></div>';
    html += '<p><strong>2. НӨАТ баримтын түвшинд</strong>, VAT identifier тус бүрд нэг удаа (D-E3, BR-SAL-22). Үнэ ' + (c.pricesInclVat ? '<strong>НӨАТ-тэй</strong>: НӨАТ = rv(G × r / (100 + r)), суурь = G − НӨАТ (BR-SAL-26)' : '<strong>НӨАТ-гүй</strong>: НӨАТ = rv(Суурь × r / 100)') + '.</p>';
    c.groups.forEach(function (g) {
      html += '<div class="formula">' + ui.esc(g.label) + ' (' + g.calcType + ', тэмдэг ' + g.sign + '):  ' + (c.pricesInclVat ? 'G' : 'Суурь') + ' = ' + fmtM(g.total) +
        '\nЯг НӨАТ = ' + fmtM(g.total) + ' × ' + g.pct + ' / ' + g.den.toString() + (g.carryIn !== 0n ? ' + carry ' + M.fmtRatio(g.carryIn, g.den, 4) : '') + ' = ' + M.fmtRatio(g.exactNum, g.den, 6) +
        '\nБөөрөнхийлсөн НӨАТ = ' + fmtM(g.vat) + (c.pricesInclVat ? '   →   суурь = ' + fmtM(g.total) + ' − ' + fmtM(g.vat) + ' = ' + fmtM(g.base) : '') + '</div>';
      if (g.lines.length > 1 && g.den !== 0n && g.vat !== 0) {
        html += '<p class="xs">Мөрүүдэд хуваарилах (running remainder, BC DivideAmount): rem += НӨАТ × LA / Σ; мөрийн НӨАТ = r(rem); rem −= мөрийн НӨАТ.</p>' +
          '<div class="table-wrap"><table class="grid-table"><thead><tr><th>Мөр</th><th class="num">Хувь (яг)</th><th class="num">rem өмнө</th><th class="num">Мөрийн НӨАТ</th><th class="num">rem дараа</th><th class="num">Тусад нь бөөрөнхийлвэл</th></tr></thead><tbody>' +
          g.alloc.map(function (a) {
            var line = c.lines[a.line];
            var alone = E().money.roundDiv(BigInt(line.LA) * BigInt(g.pct), c.pricesInclVat ? BigInt(100 + g.pct) : 100n);
            return '<tr><td>' + (a.line + 1) + '</td><td class="num">' + M.fmtRatio(a.shareNum, a.den, 7) + '</td><td class="num">' + M.fmtRatio(a.remBefore, a.den, 7) + '</td><td class="num"><strong>' + fmtM(a.vat) + '</strong></td><td class="num">' + M.fmtRatio(a.remAfter, a.den, 7) + '</td><td class="num">' + fmtM(Number(alone)) + '</td></tr>';
          }).join('') + '</tbody><tfoot><tr><td>Σ</td><td></td><td></td><td class="num">' + fmtM(g.vat) + '</td><td></td><td class="num">' +
          fmtM(g.alloc.reduce(function (s, a) { var l = c.lines[a.line]; return s + Number(E().money.roundDiv(BigInt(l.LA) * BigInt(g.pct), c.pricesInclVat ? BigInt(100 + g.pct) : 100n)); }, 0)) + '</td></tr></tfoot></table></div>';
      }
    });
    html += '<p><strong>3. Нийлбэр</strong> (06 §6.8): Дүн = Σ мөрийн дүн = ' + fmtM(c.amount) + '; НӨАТ = Σ мөрийн НӨАТ = ' + fmtM(c.vatAmount) + '; Нийт = ' + fmtM(c.amountInclVat, { sym: true }) + '. Энэ нь VAT entry, eBarimt-ийн totalVAT-тай яг тэнцүү байна (BR-SAL-23).</p>';
    return html;
  }

  function factbox(d, c, ctx) {
    var cust = d.customer ? customer(d.customer) : null;
    var html = '';
    if (cust) {
      var bal = E().sales.customerBalance(cust.no);
      var ag = E().reports.aging('customer').parties.filter(function (p) { return p.party === cust.no; })[0];
      var overdue = ag ? ag.entries.filter(function (x) { return x.days > 0 && x.remaining > 0; }).reduce(function (s, x) { return s + x.remaining; }, 0) : 0;
      var lastPay = E().state().cle.filter(function (e) { return e.customer === cust.no && e.documentType === 'PAYMENT'; }).slice(-1)[0];
      var limit = E().money.toCents(cust.creditLimit || '0');
      html += '<div class="card" data-note="sales.factbox-customer"><div class="card-head"><h3>Харилцагч</h3><span class="code small">' + cust.no + '</span></div><div class="card-body"><dl class="kv">' +
        '<dt>Үлдэгдэл</dt><dd>' + fmtM(bal) + '</dd><dt>Хугацаа хэтэрсэн</dt><dd' + (overdue ? ' style="color:var(--seal)"' : '') + '>' + fmtM(overdue) + (overdue ? ' ⚠' : '') + '</dd>' +
        '<dt>Зээлийн хязгаар</dt><dd>' + (limit ? fmtM(limit) : '—') + '</dd><dt>Сүүлд төлсөн</dt><dd>' + (lastPay ? ui.date(lastPay.postingDate) : '—') + '</dd>' +
        '<dt>Posting group</dt><dd class="code">' + cust.cpg + ' → ' + E().setup.receivablesAccount(cust.cpg) + '</dd></dl></div></div>';
    }
    var i = Math.min(ctx.selLine || 0, Math.max(0, c.lines.length - 1));
    var l = c.lines[i];
    if (l && !l.blank) {
      var a = l.account ? E().setup.account(l.account) : null;
      html += '<div class="card" data-note="sales.factbox-line"><div class="card-head"><h3>Мөр ' + (i + 1) + '</h3><span class="small muted">' + ui.esc(l.no) + '</span></div><div class="card-body"><dl class="kv">' +
        '<dt>Орлогын данс</dt><dd class="code">' + (a ? a.no : '—') + '</dd><dt colspan="2" style="grid-column:1/3;text-align:left;color:var(--ink-2)">' + (a ? ui.esc(a.name) : '') + '</dt>' +
        '<dt>Тодорхойлсон</dt><dd class="small">' + (l.type === 'ITEM' ? 'Gen. ' + (d.genBus || '?') + ' × ' + l.genProd : 'мөрийн данс') + '</dd>' +
        '<dt>НӨАТ</dt><dd>' + (l.vat ? ui.esc(E().setup.vatLabel(l.vat)) + ' · ' + l.vat.taxType : '—') + '</dd>' +
        '<dt>НӨАТ-ын данс</dt><dd class="code">' + (l.vat ? l.vat.salesAcc : '—') + '</dd>' +
        '<dt>БҮНА код</dt><dd class="code">' + ui.esc(l.bunaa || '—') + '</dd>' +
        (l.taxProductCode ? '<dt>taxProductCode</dt><dd class="code">' + ui.esc(l.taxProductCode) + '</dd>' : '') +
        '</dl></div></div>';
    }
    html += '<div class="card"><div class="card-head"><h3>Хавсралт (0)</h3></div><div class="card-body small muted">Прототипт файл хавсаргахгүй (FR-PLT-011).</div></div>';
    return html;
  }

  function bindEditor(el, ctx, d) {
    var on = function (id, ev, fn) { var x = document.getElementById(id); if (x) x.addEventListener(ev, fn); };
    on('f-customer', 'change', function (ev) {
      var v = ev.target.value;
      if (!v) { ev.target.value = d.customer || ''; return; }
      var apply = function () { E().drafts.setCustomer(d, v); rerender(ctx); };
      if (d.lines.length && d.customer) {
        ui.confirm({ title: 'Харилцагч солих', body: '<p>Харилцагч солиход мөрийн НӨАТ ба дансны тохиргоо дахин тооцогдоно. Үнэ өөрчлөгдөхгүй (BR-SAL-04). Үргэлжлүүлэх үү?</p>', ok: 'Солих' })
          .then(function (ok) { if (ok) apply(); else ev.target.value = d.customer; });
      } else apply();
    });
    var dateField = function (id, set, allowEmpty) {
      on(id, 'change', function (ev) {
        var v = ev.target.value.trim();
        if (!v && allowEmpty) { set(null); rerender(ctx); return; }
        var iso = ui.parseDate(v);
        if (!iso) { ev.target.classList.add('invalid'); ui.toast('Огноог ЖЖЖЖ.СС.ӨӨ хэлбэрээр оруулна уу (жишээ 2026.10.08).', 'error'); return; }
        set(iso); rerender(ctx);
      });
    };
    dateField('f-docdate', function (v) { d.documentDate = v; });
    dateField('f-postdate', function (v) { d.postingDate = v; });
    dateField('f-duedate', function (v) { d.dueDate = v; }, true);
    on('f-terms', 'change', function (ev) { d.terms = ev.target.value; d.dueDate = null; rerender(ctx); });
    on('f-method', 'change', function (ev) { d.method = ev.target.value; rerender(ctx); });
    on('f-ebtype', 'change', function (ev) { d.ebarimtType = ev.target.value; rerender(ctx); });
    on('f-consumer', 'input', function (ev) { d.consumerNo = ev.target.value.replace(/\D/g, '').slice(0, 8); });
    on('f-piv', 'change', function (ev) {
      var want = ev.target.checked;
      if (!d.lines.length) { E().drafts.setPricesInclVat(d, want, false); rerender(ctx); return; }
      ev.target.checked = !want;
      var m = ui.modal({ title: 'Үнийн горим солих', body: '<p>Мөртэй ноорог дээр "Үнэ НӨАТ-тэй"-г солиход нэгжийн үнийг яах вэ? (BR-SAL-27)</p><ul><li><strong>Хөрвүүлэх</strong>: үнэ × ' + (want ? '110/100' : '100/110') + ' (0.00001 нарийвчлалаар) — нийт дүн бараг хэвээр.</li><li><strong>Хэвээр үлдээх</strong>: үнэ хэвээр, НӨАТ ба нийт дүн өөрчлөгдөнө.</li></ul>',
        footer: [{ label: 'Болих' }, { label: 'Хэвээр үлдээх', onClick: function (close) { E().drafts.setPricesInclVat(d, want, false); close(true); rerender(ctx); } },
          { label: 'Хөрвүүлэх', kind: 'primary', onClick: function (close) { E().drafts.setPricesInclVat(d, want, true); close(true); rerender(ctx); } }] });
      return m;
    });
    d.lines.forEach(function (l, i) {
      on('l-type-' + i, 'change', function (ev) { E().drafts.setLineNo(d, i, ev.target.value, ''); ctx.selLine = i; rerender(ctx); });
      on('l-no-' + i, 'change', function (ev) { E().drafts.setLineNo(d, i, l.type, ev.target.value); ctx.selLine = i; rerender(ctx); });
      on('l-desc-' + i, 'input', function (ev) { l.description = ev.target.value; });
      ['qty', 'price', 'disc'].forEach(function (f) {
        on('l-' + f + '-' + i, 'input', function (ev) { l[f] = ev.target.value.replace(/[\s ]/g, ''); softUpdate(ctx, d); });
        on('l-' + f + '-' + i, 'change', function () { rerender(ctx); });
      });
      on('l-vat-' + i, 'change', function (ev) { l.vatProd = ev.target.value || null; rerender(ctx); });
      on('l-del-' + i, 'click', function () { E().drafts.removeLine(d, i); ctx.selLine = 0; rerender(ctx); });
    });
    ui.$$('tr[data-line]', el).forEach(function (tr) {
      tr.addEventListener('focusin', function () {
        var i = +tr.getAttribute('data-line');
        if (ctx.selLine !== i) { ctx.selLine = i; ui.$$('tr[data-line]', el).forEach(function (t) { t.classList.toggle('sel', t === tr); }); ui.$('#factbox').innerHTML = factbox(d, E().drafts.calc(d), ctx); app.decorateNotes(); }
      });
    });
    on('act-add', 'click', function () {
      E().drafts.addLine(d, { type: 'ITEM', no: '', qty: '1' });
      ctx.selLine = d.lines.length - 1; rerender(ctx);
      var n = document.getElementById('l-no-' + (d.lines.length - 1)); if (n) n.focus();
    });
    on('act-new', 'click', function () { var nd = E().drafts.create(null); app.navigate('sales-invoice', { draftNo: nd.no, selLine: 0 }); });
    on('act-delete', 'click', function () {
      ui.confirm({ title: 'Ноорог устгах', body: '<p>Ноорог ' + d.no + '-ийг устгах уу? Хуулийн дугаарт нөлөөлөхгүй (BR-SAL-08); устгалт эцсийнх.</p>', ok: 'Устгах', danger: true })
        .then(function (ok) { if (!ok) return; E().drafts.remove(d.no); ui.toast('Ноорог ' + d.no + ' устгагдлаа.'); ctx.draftNo = null; app.navigate('sales-invoices', { salesTab: 'drafts' }); });
    });
    on('act-preview', 'click', function () { openPreview(d, ctx); });
    on('act-post', 'click', function () { doPost(d, ctx); });
  }

  function determinationCalc(d, c) {

      for (var i = 0; i < 7; i++) for (var j = 0; j < 7; j++) {
        var on = i === 0 || i === 6 || j === 0 || j === 6 || (i >= 2 && i <= 4 && j >= 2 && j <= 4);
        if (on) ctx2.fillRect((x + i + 2) * px, (y + j + 2) * px, px, px);
      }
    };
    var inFinder = function (i, j) { return (i < 8 && j < 8) || (i > n - 9 && j < 8) || (i < 8 && j > n - 9); };
    var h = 0;
    for (var i = 0; i < n; i++) for (var j = 0; j < n; j++) {
      if (inFinder(i, j)) continue;
      h = (h * 31 + data.charCodeAt((i * n + j) % data.length) + i * 7 + j) % 1000003;
      if (h % 2) ctx2.fillRect((i + 2) * px, (j + 2) * px, px, px);
    }
    finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
  }

    var m = ui.modal({ title: payload ? 'eBarimt хэвлэх цонх' : 'eBarimt — хуулбар (QR-гүй)', body: body,
      footer: [{ label: 'Хаах', kind: payload ? 'primary' : '' }],
      onRequestClose: payload ? function () {
        return ui.confirm({ title: 'Хэвлэх цонх хаах', body: '<p>QR кодыг дахин хэвлэх боломжгүй. Хаах уу? (PRN-11)</p>', ok: 'Хаах', danger: true });
