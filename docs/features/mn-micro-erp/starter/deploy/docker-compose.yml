# =============================================================================
# MN Micro ERP - local development stack
# Location in the repository: deploy/docker-compose.yml   (paths below are relative to deploy/)
#
#   docker compose -f deploy/docker-compose.yml up -d            # core services
#   docker compose -f deploy/docker-compose.yml --profile extras up -d   # + mailpit
#   docker compose -f deploy/docker-compose.yml down -v          # stop and WIPE the database volume
#
# The API, Worker and SPA run on the host (dotnet run / npm run dev) for fast debugging.
# Spec: docs/features/mn-micro-erp/18-dev-setup.md sections 5 and 6.
# Every password in this file is a local-only placeholder, never a real secret.
# =============================================================================
name: mn-erp

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 17 (prod runs 17 or 18; DDL stays compatible with 16+).
  # To try 18: `down -v` first, then ERP_PG_IMAGE=postgres:18 ERP_PG_DATA_DIR=/var/lib/postgresql ... up -d
  # (the 18 image keeps PGDATA in /var/lib/postgresql/18/docker and refuses a mount at .../data).
  # ---------------------------------------------------------------------------
  postgres:
    image: ${ERP_PG_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres            # local only
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - max_connections=200
      - -c
      - log_min_duration_statement=250
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - idle_in_transaction_session_timeout=60s
      - -c
      - timezone=UTC
    ports:
      - "${ERP_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:${ERP_PG_DATA_DIR:-/var/lib/postgresql/data}
      # One-time bootstrap (login roles + databases), runs only when the volume is empty. Group roles, extensions,
      # module schemas and all objects come from Erp.Migrator `migrate` (canonical db/schema/000...920; the first
      # run applies 000_extensions_roles.sql and needs the postgres superuser connection, 18-dev-setup.md section 3.3).
      - ../db/init:/docker-entrypoint-initdb.d:ro
      # Whole db/ folder for manual psql work: \i /db/seed/demo/....sql
      - ../db:/db:ro
    healthcheck:
      # -h 127.0.0.1 on purpose: during first-time init the server listens only on the unix socket,
      # so a TCP check turns healthy only after the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d erp"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector: app -> OTLP (4317 gRPC / 4318 HTTP) -> redaction -> Jaeger (traces)
  # Logs and metrics go to the collector's debug exporter (docker compose logs otel-collector).
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  # ---------------------------------------------------------------------------
  # Jaeger v2 all-in-one (in-memory storage) - trace UI at http://localhost:16686
  # Not exposed: its own OTLP ports (only the collector talks to it, on the compose network).
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "16686:16686"

  # ---------------------------------------------------------------------------
  # PosAPI 3.0 mock (WireMock). Same port as a real PosAPI (7080), no token, plus a stub of the
  # api.ebarimt.mn reference endpoint getInfo. Stubs: deploy/posapi-mock/mappings/*.json
  # qrData / lottery values start with QR-CANARY- / LOTTERY-CANARY-: tests grep DB dumps, logs and traces for them.
  # Admin API: http://localhost:7080/__admin/mappings   Request log: /__admin/requests
  # Special merchant TINs drive failure paths (see starter README):
  #   99999999901 -> POST /rest/receipt hangs 40 s (client timeout => UNKNOWN, never auto-retried)
  #   99999999902 -> POST /rest/receipt returns a validation error (REJECTED)
  # Placeholder: response shapes must be re-checked against the official PosAPI.yaml (v3.2.48).
  # ---------------------------------------------------------------------------
  posapi-mock:
    image: wiremock/wiremock:3.13.2
    restart: unless-stopped
    command: ["--port", "8080", "--global-response-templating", "--disable-banner"]
    volumes:
      - ./posapi-mock:/home/wiremock:ro
    ports:
      - "7080:8080"

  # ---------------------------------------------------------------------------
  # Optional: SMTP catcher for invoice e-mails sent by the outbox (profile "extras").
  # SMTP localhost:1025, UI http://localhost:8025
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.31
    profiles: ["extras"]
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
